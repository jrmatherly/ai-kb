# Optional dedicated embed origin - uncomment and set server_name (e.g. embed.example.com).
# Serve only embed.html + static assets; proxy /api to the AI KB backend.
# See website-docs/03-features/13-embed-channel.md#embed-subdomain
#
# server {
#     listen 8080;
#     server_name embed.example.com;
#     client_max_body_size ${MAX_FILE_SIZE};
#     location = /ai-kb-widget.js { root /usr/share/nginx/html; }
#     location = /config.js { alias /tmp/nginx/config.js; }
#     # Copy the /embed/, /_embed-frame-policy, and internal /embed.html
#     # locations from the server below; all are required for the host allowlist.
#     location ^~ /assets/ { root /usr/share/nginx/html; add_header Cache-Control "public, max-age=31536000, immutable"; }
#     location /api/ { proxy_pass http://ai-kb-backend:8080; proxy_set_header Host $host; }
# }

server {
    listen 8080;
    server_name localhost;
    # Default 50M, configured via MAX_FILE_SIZE_MB env var
    client_max_body_size ${MAX_FILE_SIZE};

    # Gzip static assets (the frontend index.js is a single ~1MB file that took 20s+ uncompressed in testing;
    # compressed to about 200-300KB, load time on low-bandwidth machines in the same region dropped from 25s to 3-5s)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/xml application/rss+xml image/svg+xml font/ttf font/otf;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Error log settings
    error_log /var/log/nginx/error.log warn;
    access_log /var/log/nginx/access.log;

    # Runtime config rendered by docker-entrypoint.sh outside the read-only image root.
    # Same headers as the SPA location so it is never cached across upgrades.
    location = /config.js {
        alias /tmp/nginx/config.js;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Static widget loader for third-party sites
    location = /ai-kb-widget.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Internal fallback target for /embed/* routes. Keep it separate from the
    # main SPA location so embed pages do not inherit X-Frame-Options.
    location = /embed.html {
        internal;
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Embed widget pages may be loaded inside third-party iframes (lightweight embed.html)
    location ^~ /embed/ {
        root /usr/share/nginx/html;
        # Keep the original location through the access phase and file serving.
        # An internal redirect to /embed.html would lose the per-channel CSP.
        auth_request /_embed-frame-policy;
        auth_request_set $embed_frame_csp $upstream_http_content_security_policy;
        add_header Content-Security-Policy $embed_frame_csp always;
        try_files /embed.html =404;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Fail closed if the backend cannot resolve an enabled channel and policy.
    location = /_embed-frame-policy {
        internal;
        proxy_pass ${APP_SCHEME}://${APP_HOST}:${APP_PORT}/api/v1/embed-frame-policy;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Embed-Page-URI $request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
    }

    # Frontend static files
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # index.html and the SPA fallback must not be cached, otherwise users do not see a new version after a frontend upgrade
        add_header Cache-Control "no-cache, must-revalidate" always;
        # nginx add_header does not inherit from the outer level, so the security headers are repeated inside the location
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Vite build output /assets/* has hashed file names and can be cached long term
    location ^~ /assets/ {
        root /usr/share/nginx/html;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Proxy locally stored files to the backend (for rendering images in markdown)
    # Exact match on /files, so Nginx does not append / and trigger a 301
    location = /files {
        proxy_pass ${APP_SCHEME}://${APP_HOST}:${APP_PORT}/files;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Resource capability short link /r/<token>: IM channels depend on this route to render resource:// images;
    # without it the request falls into the SPA fallback, returns a blank page and the image does not load.
    location ^~ /r/ {
        proxy_pass ${APP_SCHEME}://${APP_HOST}:${APP_PORT};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # BrowserSkill connects from the user's Chrome through this public gateway.
    # The /authorize POST continues through the ordinary API proxy below.
    location = /api/v1/local-browser/extension {
        proxy_pass ${APP_SCHEME}://${APP_HOST}:${APP_PORT};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_next_upstream off;
        access_log /var/log/nginx/access.log api_no_query;
    }

    # Cluster RPC is only reachable directly between app nodes.
    location = /api/v1/local-browser/internal {
        return 404;
    }

    # Interactive sandbox terminal / desktop: WebSocket upgrade +
    # query-stripped logs (the handshake carries a short-lived ticket
    # in the query string). Desktop must share this location: the
    # generic /api/ proxy clears Connection, so gorilla Upgrade() would
    # otherwise reject the handshake with 400.
    location ~ ^/api/v1/sessions/[^/]+/sandbox/(terminal|desktop)$ {
        proxy_pass ${APP_SCHEME}://${APP_HOST}:${APP_PORT};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        access_log /var/log/nginx/access.log api_no_query;
    }

    # The two collection routes for skill zip uploads, with the body limit raised to MAX_SKILL_BUNDLE_SIZE.
    # A separate location instead of raising the site-wide limit: client_max_body_size applies per
    # location, so setting it at server level would let endpoints such as knowledge base uploads accept skill-bundle-sized
    # bodies. It sits before /api/ because a regex location takes precedence over a prefix location.
    # Matches only the collections themselves (POST upload / GET list), not sub-paths such as /install or PATCH:
    # those are small JSON and must keep going through the MAX_FILE_SIZE of /api/ below.
    location ~ ^/api/v1/(?:skills/catalog|sandbox-configs/[^/]+/skills)/?$ {
        client_max_body_size ${MAX_SKILL_BUNDLE_SIZE};

        # proxy_pass in a regex location cannot carry a URI, so the original path passes through unchanged,
        # matching what the `proxy_pass .../api/` rewrite on /api/ produces.
        proxy_pass ${APP_SCHEME}://${APP_HOST}:${APP_PORT};
        include /etc/nginx/api-proxy.conf;
    }

    # Public Streamable HTTP MCP endpoints use their own bearer-token auth.
    # Preserve /mcp/<endpoint_id> and the same streaming settings as the API.
    location ^~ /mcp/ {
        proxy_pass ${APP_SCHEME}://${APP_HOST}:${APP_PORT};
        include /etc/nginx/api-proxy.conf;
    }

    # Proxy API requests to the backend
    # APP_SCHEME defaults to http; set it to https for a remote HTTPS backend
    location /api/ {
        proxy_pass ${APP_SCHEME}://${APP_HOST}:${APP_PORT}/api/;
        include /etc/nginx/api-proxy.conf;
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
