# Shared backend proxy settings for the /api/ and /mcp/ locations.
#
# The API, skill-upload and MCP locations share headers and streaming behavior.
# Only proxy_pass stays in each location, since a regex location cannot carry
# a URI in it.
#
# This file is copied verbatim, not run through envsubst, so $host and friends
# survive as nginx variables.

# Preserve the public port for same-origin embed API checks on HTTP deployments.
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $aikb_forwarded_proto;

# Connection and retry settings
proxy_connect_timeout 30s;                 # connect timeout
proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
proxy_next_upstream_tries 3;               # retry count
proxy_next_upstream_timeout 30s;           # retry timeout

# SSE settings
proxy_http_version 1.1;                    # use HTTP/1.1
proxy_set_header Connection "";            # no Connection: close, keep the connection open
chunked_transfer_encoding off;             # disable chunked transfer encoding
proxy_buffering off;                       # disable buffering
proxy_cache off;                           # disable caching
proxy_read_timeout 3600s;                  # longer read timeout
proxy_send_timeout 3600s;                  # longer send timeout
