<!DOCTYPE html>
<html lang="en">
<head>
    <title>AI KB</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimal-ui">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="renderer" content="webkit">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="keywords" content="knowledge Q&amp;A, WeChat conversational open platform, conversational open platform, conversational platform, AI customization, human-computer dialogue, intelligent Q&amp;A, human-computer interaction, natural language processing, natural language understanding, NLP, AI product, open-source AI, AI algorithms, voice assistant"/>
    <meta name="description" content="AI KB is a document understanding and semantic retrieval framework built on large language models, designed for documents with complex structure and heterogeneous content."/>
    <link rel="shortcut icon" type="image/png" href="./public/favicon.ico"/>
    <link rel="apple-touch-icon" sizes="120x120" type="image/png" href="./public/favicon.ico"/>
    <style>
      /* Boot placeholder inside #app; Vue's mount replaces it. theme-mode is set before #app parses. */
      .aikb-boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; font: 14px system-ui, -apple-system, "Segoe UI", sans-serif; color: rgba(0, 0, 0, .55); }
      html[theme-mode="dark"] .aikb-boot { color: rgba(255, 255, 255, .55); }
      .aikb-boot-spinner { width: 24px; height: 24px; box-sizing: border-box; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: aikb-boot-spin .8s linear infinite; }
      @keyframes aikb-boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .aikb-boot-spinner { animation-duration: 2.4s; } }
    </style>
</head>
<body>
<script>
(function(){
  var t=localStorage.getItem('AIKB_theme')||'light';
  if(t==='system')t=window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
  document.documentElement.setAttribute('theme-mode',t);
  /* Matches --td-bg-color-page in theme.css, so the page background does not jump from #fff to #eee and flash when styles load */
  var bg=t==='dark'?'#181818':'#eee';
  document.documentElement.style.background=bg;
  document.documentElement.style.minHeight='100%';
  document.documentElement.style.colorScheme=t==='dark'?'dark':'light';
  document.body.style.background=bg;
  document.body.style.minHeight='100%';
  try{
    var w=window.runtime;
    if(w){
      if(t==='dark'){
        if(w.WindowSetDarkTheme)w.WindowSetDarkTheme();
        if(w.WindowSetBackgroundColour)w.WindowSetBackgroundColour(24,24,24,255);
      }else{
        if(w.WindowSetLightTheme)w.WindowSetLightTheme();
        if(w.WindowSetBackgroundColour)w.WindowSetBackgroundColour(238,238,238,255);
      }
    }
  }catch(_){}
})();
</script>
<script>
(function(){
  try {
    if (localStorage.getItem('aikb_lite_mode') !== 'true') return;
    var saved = sessionStorage.getItem('aikb_lite_last_path');
    if (!saved || saved.indexOf('/platform/') !== 0 || saved.indexOf('/platform/organizations') === 0) return;
    var path = window.location.pathname;
    if (path !== '/' && path !== '/platform' && path !== '/platform/knowledge-bases') return;
    var target = saved.indexOf('#') >= 0 ? saved.slice(0, saved.indexOf('#')) : saved;
    if (!target) return;
    var current = window.location.pathname + window.location.search;
    if (target !== current) window.history.replaceState(window.history.state, '', target);
  } catch (e) {}
})();
</script>
<!-- Above the blocking scripts below, so the placeholder paints while they download. -->
<div id="app"><div class="aikb-boot" role="status"><div class="aikb-boot-spinner"></div>Loading AI KB</div></div>
<script>
(function(){
  var t=localStorage.getItem('AIKB_theme')||'light';
  if(t==='system')t=window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
  var bg=t==='dark'?'#181818':'#eee';
  var el=document.getElementById('app');
  if(el){ el.style.background=bg; el.style.minHeight='100%'; }
})();
</script>
<script src="/config.js"></script>
<!--
  Offline deployment: load the tdesign-icons SVG sprite locally up front, so tdesign-vue-next's
  <t-icon> does not request https://tdesign.gtimg.com at run time (see issue #867 / #897).
  When upgrading tdesign-icons-vue-next, also update public/tdesign-icons/<version>/fonts/index.js.
-->
<script src="/tdesign-icons/0.4.5/fonts/index.js"></script>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
