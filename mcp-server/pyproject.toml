[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-kb-mcp"
version = "1.1.2"
description = "AI KB MCP Server - Model Context Protocol server for AI KB API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "AI KB Team", email = "support@matherly.net"}
]
maintainers = [
    {name = "AI KB Team", email = "support@matherly.net"}
]
keywords = ["mcp", "model-context-protocol", "aikb", "knowledge-management", "api-server"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = [
    "mcp>=2,<3",
    "requests>=2.33.0",
    "starlette>=1.3.1",
    "uvicorn>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0",
    "flake8>=6.0",
    "mypy>=1.0",
]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://github.com/jrmatherly/ai-kb"
Documentation = "https://ai-kb.matherly.net/docs/"
Repository = "https://github.com/jrmatherly/ai-kb/tree/main/mcp-server"
"Bug Reports" = "https://github.com/jrmatherly/ai-kb/issues"
Changelog = "https://github.com/jrmatherly/ai-kb/blob/main/mcp-server/CHANGELOG.md"

[project.scripts]
ai-kb-mcp-server = "main:sync_main"
ai-kb-server = "run_server:main"

[tool.setuptools]
py-modules = ["aikb_mcp_server", "upload_paths", "main", "run_server", "run", "test_module"]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["*.md", "*.txt", "*.yml", "*.yaml"]

# Supply-chain cooldown: resolution skips releases younger than 7 days (stored as a span, so uv.lock stays stable).
[tool.uv]
exclude-newer = "7 days"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"