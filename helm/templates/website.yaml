{{/*
AI KB website and documentation Deployment and Service.
The image serves the homepage at / and the documentation under /docs/; the Ingress forwards only /docs
to it, so the frontend keeps /. Probes hit /docs/ for that reason.
*/}}
{{- if .Values.website.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-kb.fullname" . }}-website
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ai-kb.componentLabels" (dict "component" "website" "context" .) | nindent 4 }}
spec:
  replicas: {{ .Values.website.replicaCount }}
  selector:
    matchLabels:
      {{- include "ai-kb.componentSelectorLabels" (dict "component" "website" "context" .) | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "ai-kb.componentSelectorLabels" (dict "component" "website" "context" .) | nindent 8 }}
    spec:
      {{- include "ai-kb.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "ai-kb.serviceAccountName" . }}
      {{- with (.Values.website.podSecurityContext | default .Values.global.podSecurityContext) }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: website
          image: {{ include "ai-kb.website.image" . }}
          imagePullPolicy: {{ .Values.website.image.pullPolicy }}
          {{- with .Values.website.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          resources:
            {{- toYaml .Values.website.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /docs/
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /docs/
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          # The root filesystem is read-only; nginx keeps its pid, temp files and the rendered config under /tmp.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.website.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.website.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.website.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-kb.serviceName" (dict "component" "website" "context" .) | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ai-kb.componentLabels" (dict "component" "website" "context" .) | nindent 4 }}
spec:
  type: {{ .Values.website.service.type }}
  selector:
    {{- include "ai-kb.componentSelectorLabels" (dict "component" "website" "context" .) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.website.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
