Copyright 2025 Tencent
SPDX-License-Identifier: MIT

Ingress resource for AI KB.
Routes /api to backend, /docs to the website when enabled, / to frontend.
*/}}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ai-kb.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ai-kb.componentLabels" (dict "component" "ingress" "context" .) | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      {{- if .Values.ingress.tls.secretName }}
      secretName: {{ .Values.ingress.tls.secretName }}
      {{- end }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # API routes - must come first (more specific path)
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "ai-kb.serviceName" (dict "component" "app" "context" .) | quote }}
                port:
                  name: http
          {{- if .Values.website.enabled }}
          # Documentation - the website image serves /docs/ (and / unused here, the frontend owns it)
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: {{ include "ai-kb.serviceName" (dict "component" "website" "context" .) | quote }}
                port:
                  name: http
          {{- end }}
          # Frontend routes - catch-all
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "ai-kb.serviceName" (dict "component" "frontend" "context" .) | quote }}
                port:
                  name: http
{{- end }}
