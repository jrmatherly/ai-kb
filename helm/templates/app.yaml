{{- if .Values.app.enabled }}
{{- $dbHost := include "ai-kb.serviceName" (dict "component" "postgresql" "context" .) }}
{{- $dbPort := 5432 }}
{{- if not .Values.postgresql.enabled }}
{{- $dbHost = required "externalDatabase.host is required when postgresql.enabled is false" .Values.externalDatabase.host }}
{{- $dbPort = .Values.externalDatabase.port | default $dbPort }}
{{- end }}
{{- $redisAddr := printf "%s:6379" (include "ai-kb.serviceName" (dict "component" "redis" "context" .)) }}
{{- if not .Values.redis.enabled }}
{{- $redisAddr = required "externalRedis.addr is required when redis.enabled is false" .Values.externalRedis.addr }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-kb.fullname" . }}-app
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ai-kb.componentLabels" (dict "component" "app" "context" .) | nindent 4 }}
spec:
  replicas: {{ .Values.app.replicaCount }}
  selector:
    matchLabels:
      {{- include "ai-kb.componentSelectorLabels" (dict "component" "app" "context" .) | nindent 6 }}
  strategy:
    {{- $strategy := .Values.app.strategy | default dict }}
    {{- /* A surge Pod on another node hangs on attach unless the data-files volume is ReadWriteMany. */}}
    {{- $sharedVolume := or (not .Values.dataFiles.persistence.enabled) (eq .Values.dataFiles.persistence.accessMode "ReadWriteMany") }}
    {{- $strategyType := $strategy.type | default (ternary "RollingUpdate" "Recreate" $sharedVolume) }}
    {{- if not (has $strategyType (list "RollingUpdate" "Recreate")) }}
    {{- fail "app.strategy.type must be RollingUpdate or Recreate" }}
    {{- end }}
    type: {{ $strategyType }}
    {{- if eq $strategyType "RollingUpdate" }}
    rollingUpdate:
      {{- toYaml ($strategy.rollingUpdate | default (dict "maxSurge" 1 "maxUnavailable" 0)) | nindent 6 }}
    {{- end }}
  template:
    metadata:
      annotations:
        checksum/secret: {{ list .Values.secrets .Values.neo4j.username .Values.neo4j.password | toYaml | sha256sum }}
      labels:
        {{- include "ai-kb.componentSelectorLabels" (dict "component" "app" "context" .) | nindent 8 }}
    spec:
      {{- include "ai-kb.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "ai-kb.serviceAccountName" . }}
      {{- with .Values.app.podSecurityContext | default .Values.global.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: app
          image: {{ include "ai-kb.app.image" . }}
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          {{- with .Values.app.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            # Application settings
            - name: GIN_MODE
              value: {{ .Values.app.env.GIN_MODE | quote }}
            - name: TZ
              value: {{ .Values.app.env.TZ | quote }}
            - name: MAX_FILE_SIZE_MB
              value: {{ .Values.global.maxFileSizeMB | quote }}
            # Database configuration
            - name: DB_DRIVER
              value: "postgres"
            - name: DB_HOST
              value: {{ $dbHost | quote }}
            - name: DB_PORT
              value: {{ $dbPort | quote }}
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-kb.secretName" . }}
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-kb.secretName" . }}
                  key: DB_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-kb.secretName" . }}
                  key: DB_NAME
            # Redis configuration
            - name: REDIS_ADDR
              value: {{ $redisAddr | quote }}
            - name: REDIS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-kb.secretName" . }}
                  key: REDIS_USERNAME
                  optional: true
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-kb.secretName" . }}
                  key: REDIS_PASSWORD
            - name: REDIS_DB
              value: "0"
            - name: REDIS_PREFIX
              value: "stream:"
            - name: STREAM_MANAGER_TYPE
              value: {{ .Values.app.env.STREAM_MANAGER_TYPE | quote }}
            # Security
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-kb.secretName" . }}
                  key: JWT_SECRET
            - name: SYSTEM_AES_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-kb.secretName" . }}
                  key: SYSTEM_AES_KEY
            # Retrieval & Storage
            - name: RETRIEVE_DRIVER
              value: {{ .Values.app.env.RETRIEVE_DRIVER | quote }}
            - name: STORAGE_TYPE
              value: {{ .Values.app.env.STORAGE_TYPE | quote }}
            - name: LOCAL_STORAGE_BASE_DIR
              value: {{ .Values.app.env.LOCAL_STORAGE_BASE_DIR | quote }}
            # Document reader
            - name: DOCREADER_ADDR
              value: {{ printf "%s:50051" (include "ai-kb.serviceName" (dict "component" "docreader" "context" .)) | quote }}
            # Processing
            - name: AUTO_RECOVER_DIRTY
              value: {{ .Values.app.env.AUTO_RECOVER_DIRTY | quote }}
            - name: CONCURRENCY_POOL_SIZE
              value: {{ .Values.app.env.CONCURRENCY_POOL_SIZE | quote }}
            # Docker sandbox is off unless the deployer opts in. A workspace
            # admin who can save a Docker config can create containers on
            # whatever Engine API this process can reach (often host root).
            - name: AIKB_SANDBOX_DOCKER_ENABLED
              value: {{ .Values.app.env.AIKB_SANDBOX_DOCKER_ENABLED | default "false" | quote }}
            {{- if .Values.neo4j.enabled }}
            # Neo4j configuration (for GraphRAG)
            # NEO4J_ENABLE is the only knowledge graph switch (the Go code reads it, not ENABLE_GRAPH_RAG).
            # Injected automatically when neo4j.enabled=true, so users need not set it.
            - name: NEO4J_ENABLE
              value: "true"
            - name: NEO4J_URI
              value: {{ printf "bolt://%s:7687" (include "ai-kb.serviceName" (dict "component" "neo4j" "context" .)) | quote }}
            - name: NEO4J_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-kb.secretName" . }}
                  key: NEO4J_USERNAME
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-kb.secretName" . }}
                  key: NEO4J_PASSWORD
            {{- end }}
            {{- with .Values.app.extraEnv }}
            # Additional environment variables
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: data-files
              mountPath: /data/files
            # The root filesystem is read-only; downloads, imports and DuckDB spill files land here.
            - name: tmp
              mountPath: /tmp
            {{- with .Values.app.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
          {{- with .Values.app.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.app.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: data-files
          {{- if .Values.dataFiles.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.dataFiles.persistence.existingClaim | default (printf "%s-data-files" (include "ai-kb.fullname" .)) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
        {{- with .Values.app.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.app.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.app.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.app.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-kb.serviceName" (dict "component" "app" "context" .) | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ai-kb.componentLabels" (dict "component" "app" "context" .) | nindent 4 }}
spec:
  type: {{ .Values.app.service.type }}
  selector:
    {{- include "ai-kb.componentSelectorLabels" (dict "component" "app" "context" .) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.app.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
