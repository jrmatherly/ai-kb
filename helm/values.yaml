#
# AI KB Helm Chart Values
#
# Best Practices References:
# - https://helm.sh/docs/chart_best_practices/values/
# - https://github.com/argoproj/argo-helm/blob/main/charts/argo-cd/values.yaml
# - https://github.com/cert-manager/cert-manager/blob/master/deploy/charts/cert-manager/values.yaml

# -- Global configuration shared across all components
# @default -- See values.yaml
global:
  # -- Storage class for all PersistentVolumeClaims
  # Set to "-" to use cluster default, or specify a storage class name
  storageClass: ""

  # -- Image pull secrets for private registries
  # @default -- []
  imagePullSecrets: []
  # - name: regcred

  # -- Maximum upload size in MB, applied to the frontend (nginx
  # client_max_body_size), the app (upload limit) and docreader (gRPC message
  # limit). Same knob as MAX_FILE_SIZE_MB in docker-compose.yml.
  maxFileSizeMB: 50

  # -- Default pod security context. Every AI KB image and the bundled postgres and redis run as a
  # non-root user with a read-only root filesystem, so the chart fits the `restricted` Pod Security
  # Standard; each component sets its own user and emptyDirs under its securityContext.
  # Ref: https://kubernetes.io/docs/concepts/security/pod-security-standards/
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

# -- ServiceAccount configuration
# Ref: https://helm.sh/docs/chart_best_practices/rbac/
serviceAccount:
  # -- Create a ServiceAccount
  create: true
  # -- ServiceAccount name (auto-generated if empty)
  name: ""
  # -- Annotations to add to the ServiceAccount
  annotations: {}
  # -- Labels to add to the ServiceAccount
  labels: {}
  # -- Automount API credentials for the ServiceAccount
  automountServiceAccountToken: false

# -----------------------------------------------------------------------------
# App (Backend API Server)
# -----------------------------------------------------------------------------
app:
  # -- Enable the app component
  enabled: true

  # -- Number of replicas
  replicaCount: 1

  # -- App update strategy
  strategy:
    # -- RollingUpdate or Recreate. Empty picks RollingUpdate when the data-files volume is
    # ReadWriteMany or persistence is off, Recreate otherwise (a single-node-attach volume).
    type: ""
    # -- Only used with RollingUpdate; integers and percentages are supported.
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  image:
    # -- Image repository
    repository: ghcr.io/jrmatherly/ai-kb-app
    # -- Image tag (defaults to Chart.appVersion if empty)
    tag: ""
    # -- Image pull policy
    pullPolicy: IfNotPresent

  # -- Resource requests and limits
  # Ref: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

  # -- Pod security context: the data-files volume is group-writable for appuser (1000). A mounted
  # Docker socket for the sandbox needs its group id under supplementalGroups.
  podSecurityContext:
    runAsNonRoot: true
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

  # -- Container security context: the image runs as appuser (1000) with a read-only root filesystem
  # and writes only to /tmp (an emptyDir) and the data-files volume. Opt-in log or dump paths
  # (LOG_PATH, LLM_DEBUG_LOG, AIKB_LLM_STREAM_RAW_DUMP) must point at one of those.
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

  # -- Environment variables for the app container
  # Ref: https://github.com/jrmatherly/ai-kb/blob/main/docker-compose.yml
  env:
    GIN_MODE: release
    # -- Retrieval driver: postgres, elasticsearch_v7, elasticsearch_v8, qdrant
    RETRIEVE_DRIVER: postgres
    # -- Storage type: local, minio, cos, tos, s3, obs, oss, ks3 (set the provider's variables in app.extraEnv)
    STORAGE_TYPE: local
    LOCAL_STORAGE_BASE_DIR: /data/files
    AUTO_RECOVER_DIRTY: "true"
    # A failed boot migration fails the Pod (the startup probe then restarts it) instead of
    # serving on a half-migrated schema. The app's own default is to warn and keep serving.
    AIKB_MIGRATE_FAIL_FAST: "true"
    STREAM_MANAGER_TYPE: redis
    CONCURRENCY_POOL_SIZE: "5"
    TZ: UTC
    # Docker sandbox talks to a local Engine API (often docker.sock = host root).
    # Leave false unless this is a private single-node install that also mounts
    # the daemon socket or points at a remote tcp:// daemon with TLS.
    AIKB_SANDBOX_DOCKER_ENABLED: "false"

  # -- Additional environment variables
  extraEnv: []
  # - name: OLLAMA_BASE_URL
  #   value: "http://ollama:11434"

  # -- Additional envFrom sources for the app container (ConfigMaps or Secrets loaded whole)
  extraEnvFrom: []
  # - secretRef:
  #     name: ai-kb-provider-keys

  # -- Additional volumes for the app pod
  extraVolumes: []
  # - name: builtin-models
  #   configMap:
  #     name: ai-kb-builtin-models

  # -- Additional volume mounts for the app container (pair with BUILTIN_MODELS_CONFIG in extraEnv)
  extraVolumeMounts: []
  # - name: builtin-models
  #   mountPath: /config/builtin_models.yaml
  #   subPath: builtin_models.yaml
  #   readOnly: true

  # -- Service configuration
  service:
    # -- Service name override (empty keeps "app")
    name: ""
    type: ClusterIP
    port: 8080

  # -- Startup probe configuration. Holds off liveness while boot runs the versioned
  # migrations (AUTO_MIGRATE), up to 5 minutes at these defaults. Values merge, so a
  # different handler needs `httpGet: null` beside it.
  startupProbe:
    httpGet:
      path: /health
      port: http
    periodSeconds: 5
    failureThreshold: 60

  # -- Liveness probe configuration
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  # -- Readiness probe configuration
  readinessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

  # -- Node selector
  nodeSelector: {}

  # -- Tolerations
  tolerations: []

  # -- Affinity rules
  affinity: {}

# -----------------------------------------------------------------------------
# Frontend (Web UI)
# -----------------------------------------------------------------------------
frontend:
  # -- Enable the frontend component
  enabled: true

  # -- Number of replicas
  replicaCount: 1

  image:
    # -- Image repository
    repository: ghcr.io/jrmatherly/ai-kb-ui
    # -- Image tag (defaults to Chart.appVersion if empty)
    tag: ""
    # -- Image pull policy
    pullPolicy: IfNotPresent

  # -- Resource requests and limits
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

  # -- Container security context: nginx runs as its own user (101) on port 8080 with a read-only root
  # filesystem and writes only under /tmp (an emptyDir; nginx buffers upload bodies there, so it is unbounded)
  securityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

  # -- Service configuration
  service:
    # -- Service name override (empty keeps "frontend")
    name: ""
    type: ClusterIP
    port: 80

  # -- Node selector
  nodeSelector: {}

  # -- Tolerations
  tolerations: []

  # -- Affinity rules
  affinity: {}

# -----------------------------------------------------------------------------
# Website (documentation, served under /docs on the same host as the frontend)
# -----------------------------------------------------------------------------
website:
  # -- Enable the website component. The Ingress forwards /docs to it; the frontend keeps /.
  enabled: true

  # -- Number of replicas
  replicaCount: 1

  image:
    # -- Image repository
    repository: ghcr.io/jrmatherly/ai-kb-website
    # -- Image tag (defaults to Chart.appVersion if empty)
    tag: ""
    # -- Image pull policy
    pullPolicy: IfNotPresent

  # -- Resource requests and limits
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

  # -- Container security context: nginx runs as its own user (101) on port 8080 with a read-only root
  # filesystem and writes only under /tmp (an emptyDir)
  securityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

  # -- Service configuration
  service:
    # -- Service name override (empty keeps "website")
    name: ""
    type: ClusterIP
    port: 80

  # -- Node selector
  nodeSelector: {}

  # -- Tolerations
  tolerations: []

  # -- Affinity rules
  affinity: {}

# -----------------------------------------------------------------------------
# Docreader (Document Parser - gRPC)
# -----------------------------------------------------------------------------
docreader:
  # -- Enable the docreader component
  enabled: true

  # -- Number of replicas
  replicaCount: 1

  image:
    # -- Image repository
    repository: ghcr.io/jrmatherly/ai-kb-docreader
    # -- Image tag (defaults to Chart.appVersion if empty)
    tag: ""
    # -- Image pull policy
    pullPolicy: IfNotPresent

  # -- Resource requests and limits
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # -- Container security context: the image runs as uid 1000 with a read-only root filesystem and
  # writes only under /tmp (an emptyDir)
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

  # -- Additional environment variables for the docreader container
  extraEnv: []
  # - name: LOG_LEVEL
  #   value: "DEBUG"

  # -- Service configuration
  service:
    # -- Service name override (empty keeps "docreader")
    name: ""
    type: ClusterIP
    port: 50051

  # -- Node selector
  nodeSelector: {}

  # -- Tolerations
  tolerations: []

  # -- Affinity rules
  affinity: {}

# -----------------------------------------------------------------------------
# PostgreSQL (ParadeDB - Vector + BM25 Search)
# -----------------------------------------------------------------------------
postgresql:
  # -- Enable PostgreSQL
  enabled: true

  service:
    # -- Service name override (empty keeps "postgres")
    name: ""

  image:
    # -- Image repository (ParadeDB for vector search)
    repository: paradedb/paradedb
    # -- Image tag
    tag: v0.26.1-pg18

  # -- Resource requests and limits
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # -- Pod security context (the data volume is group-writable for the postgres user)
  podSecurityContext:
    runAsNonRoot: true
    fsGroup: 999
    seccompProfile:
      type: RuntimeDefault

  # -- Container security context: the image runs as the postgres user (999) with a read-only root
  # filesystem; /var/run/postgresql and /tmp are emptyDirs
  securityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

  # -- Persistence configuration
  persistence:
    # -- Enable persistence
    enabled: true
    # -- Size of the PVC
    size: 10Gi
    # -- Use existing PVC (leave empty to create new)
    existingClaim: ""

  # -- Node selector
  nodeSelector: {}

  # -- Tolerations
  tolerations: []

  # -- Affinity rules
  affinity: {}

# -----------------------------------------------------------------------------
# Redis (Stream & Task Queue)
# -----------------------------------------------------------------------------
redis:
  # -- Enable Redis
  enabled: true

  service:
    # -- Service name override (empty keeps "redis")
    name: ""

  image:
    # -- Image repository
    repository: redis
    # -- Image tag
    tag: 8.10.2-alpine

  # -- Resource requests and limits
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

  # -- Pod security context (the data volume is group-writable for the redis user)
  podSecurityContext:
    runAsNonRoot: true
    fsGroup: 999
    seccompProfile:
      type: RuntimeDefault

  # -- Container security context: the image runs as the redis user (999) with a read-only root
  # filesystem; it writes only under /data
  securityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

  # -- Persistence configuration
  persistence:
    # -- Enable persistence
    enabled: true
    # -- Size of the PVC
    size: 1Gi
    # -- Use existing PVC (leave empty to create new)
    existingClaim: ""

  # -- Node selector
  nodeSelector: {}

  # -- Tolerations
  tolerations: []

  # -- Affinity rules
  affinity: {}

# -----------------------------------------------------------------------------
# External PostgreSQL and Redis
# -----------------------------------------------------------------------------
# -- Required when postgresql.enabled is false
externalDatabase:
  # -- Database host
  host: ""
  # -- Database port
  port: 5432
  # -- PostgreSQL sslmode: disable, require, verify-ca or verify-full
  sslMode: disable

# -- Required when redis.enabled is false
externalRedis:
  # -- Redis address as host:port
  addr: ""
  # -- Redis logical database number
  db: 0

# -- Neo4j run outside the chart, for GraphRAG. Setting uri enables the knowledge graph;
# it cannot be combined with neo4j.enabled. Credentials come from neo4j.username and
# neo4j.password (or the existing Secret) in both cases.
externalNeo4j:
  # -- Bolt URI, for example bolt://neo4j.example.internal:7687
  uri: ""

# -----------------------------------------------------------------------------
# Data Files Storage
# -----------------------------------------------------------------------------
dataFiles:
  persistence:
    # -- Enable persistence for uploaded files
    enabled: true
    # -- Size of the PVC
    size: 10Gi
    # -- Access mode of the PVC. Also describes an existingClaim: ReadWriteMany lets the app roll
    # across nodes, anything else defaults app.strategy to Recreate.
    accessMode: ReadWriteOnce
    # -- Use existing PVC (leave empty to create new)
    existingClaim: ""

# -----------------------------------------------------------------------------
# Ingress Configuration
# -----------------------------------------------------------------------------
ingress:
  # -- Enable ingress
  enabled: false

  # -- Ingress class name
  className: nginx

  # -- Ingress hostname
  host: ai-kb.example.com

  # -- TLS configuration
  tls:
    # -- Enable TLS
    enabled: false
    # -- TLS secret name
    secretName: ""

  # -- Additional annotations
  # Ref: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"

# -----------------------------------------------------------------------------
# Secrets Configuration
# -----------------------------------------------------------------------------
# IMPORTANT: Do NOT use default values in production!
# Use --set or external secret management (External Secrets Operator, Vault, etc.)
#
# Example installation:
#   helm install ai-kb ./helm \
#     --set secrets.dbPassword=<secure-password> \
#     --set secrets.redisPassword=<secure-password> \
#     --set secrets.jwtSecret=<secure-random-string>
#
secrets:
  # -- Database username
  dbUser: postgres
  # -- Database password (REQUIRED: change in production)
  dbPassword: ""
  # -- Database name
  dbName: ai_kb
  # -- Redis username (OPTIONAL: for Redis 6.0+ ACL)
  redisUsername: ""
  # -- Redis password (REQUIRED: change in production)
  redisPassword: ""
  # -- JWT signing secret (REQUIRED: change in production)
  jwtSecret: ""
  # -- System AES-256 key for database field encryption (must be exactly 32 bytes).
  # Encrypts: tenants.api_key, model API keys, vector store credentials,
  # web search provider keys, WeKnoraCloud.AppSecret.
  # STRONGLY RECOMMENDED to set this explicitly in production. If left empty, a
  # random 32-char value is generated on first install and reused on subsequent
  # `helm upgrade` via Secret lookup. However, if the Secret is ever
  # deleted/recreated (e.g. namespace recreated, GitOps prune, cluster rebuilt)
  # a new random value will be generated and any data encrypted with the old
  # key becomes UNRECOVERABLE (the UI will display ciphertext like "enc:v1:..."
  # instead of plaintext).
  systemAesKey: ""
  # -- Key for presigned file URLs. Empty writes nothing and the app signs with SYSTEM_AES_KEY;
  # the chart never generates one.
  systemSigningKey: ""
  # -- Shared token the app sends and docreader enforces on its gRPC calls. Empty leaves the
  # docreader channel unauthenticated.
  grpcAuthToken: ""

  # -- Use existing secret instead of creating one
  # The secret must contain keys: DB_USER, DB_PASSWORD, DB_NAME, REDIS_USERNAME, REDIS_PASSWORD, JWT_SECRET, SYSTEM_AES_KEY,
  # plus NEO4J_USERNAME and NEO4J_PASSWORD when neo4j.enabled is true or externalNeo4j.uri is set.
  # Optional keys, read when present: SYSTEM_SIGNING_KEY, GRPC_AUTH_TOKEN.
  existingSecret: ""

# -----------------------------------------------------------------------------
# Optional Components (Profiles from docker-compose)
# -----------------------------------------------------------------------------

# -- Neo4j configuration (Knowledge Graph)
# Equivalent to: docker compose --profile neo4j
# Required for GraphRAG feature (sets NEO4J_ENABLE=true automatically when enabled)
neo4j:
  # -- Enable Neo4j for GraphRAG
  enabled: false

  service:
    # -- Service name override (empty keeps "neo4j")
    name: ""

  image:
    # -- Image repository
    repository: neo4j
    # -- Image tag (matches docker-compose.yml)
    tag: "2026.09.0"

  # -- Neo4j authentication username
  username: neo4j
  # -- Neo4j authentication password (REQUIRED if enabled)
  password: ""

  # -- Resource requests and limits
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

  # -- Pod security context: the data volume is group-writable for the neo4j user (7474)
  podSecurityContext:
    runAsNonRoot: true
    fsGroup: 7474
    seccompProfile:
      type: RuntimeDefault

  # -- Container security context: the neo4j user (7474) on a read-only root filesystem
  securityContext:
    runAsNonRoot: true
    runAsUser: 7474
    runAsGroup: 7474
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

  # -- Persistence configuration
  persistence:
    # -- Enable persistence
    enabled: true
    # -- Size of the PVC
    size: 10Gi
    # -- Use existing PVC (leave empty to create new)
    existingClaim: ""

  # -- Node selector
  nodeSelector: {}

  # -- Tolerations
  tolerations: []

  # -- Affinity rules
  affinity: {}
