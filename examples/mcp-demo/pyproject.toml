[project]
name = "ai-kb-mcp-demo"
version = "0.1.0"
description = "Example MCP server for connecting to AI KB"
requires-python = ">=3.11"
dependencies = ["mcp>=2,<3", "uvicorn>=0.24.0"]

[dependency-groups]
dev = ["httpx>=0.27.0"]

[tool.uv]
required-version = ">=0.13.0"
exclude-newer = "2 days"
# Advisory override: a release that fixes a published advisory skips the cooldown (GHSA-6q48-6c7w-9gw2,
# certifi 2026.10.19). Remove after 2026-10-22, when it is two days old, or the entry caps certifi at this date.
exclude-newer-package = { certifi = "2026-10-21T00:00:00Z" }
