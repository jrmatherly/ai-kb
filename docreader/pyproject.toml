[project]
name = "docreader"
version = "2026.10.23"
description = "AI KB document parsing gRPC service"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.14.2",
    "grpcio>=1.80.0",
    "grpcio-health-checking>=1.80.0",
    "grpcio-tools>=1.80.0",
    "lxml>=6.1.0",
    "markdownify>=0.13.1",
    "markitdown[docx,pdf,xls,xlsx,pptx]>=0.1.3",
    "opendataloader-pdf>=2.4.7",
    "openpyxl>=3.1.0",
    "pandas>=3.0.6",
    "xlrd>=2.0.0",
    "pillow>=12.2.0",
    # <1.63: WebKit 1.63 and 1.64 follow a redirect by dialing the origin directly, skipping the SSRF proxy.
    # Lift the cap when test_webkit_redirects_and_subresources_use_proxy (tests/test_ssrf_proxy.py)
    # passes on a newer release; the cap also hides the upgrade from the release preflight notes.
    "playwright>=1.55.0,<1.63",
    "protobuf>=6.33.5",
    "pydantic>=2.13.4",
    "pypdf>=6.19.0",
    "pypdfium2>=5.8.0",
    "python-docx>=1.2.0",
    "requests>=2.33.0",
    "trafilatura>=2.0.0",
    "python-calamine>=0.8.2",
]

# The one uv floor: uv refuses older versions; docker/Dockerfile.docreader and the workflows' setup-uv (version-file)
# install the newest version that satisfies it. 0.13.0 wrote uv.lock revision 5; raise it when a newer uv rewrites the lockfile.
# ebooklib is AGPL-3.0-or-later. The test fixtures write EPUBs with it; the service reads them with the
# standard library (parser/epub_container.py), and docker/Dockerfile.docreader syncs with --no-dev.
[dependency-groups]
dev = ["ebooklib>=0.18"]

[tool.uv]
# >=0.12.19 is the uv Dependabot runs (dependabot-core uv/Dockerfile); a higher floor stops its security PRs
# for this project, while the image and CI install the newest uv the spec allows.
required-version = ">=0.12.19"
# Supply-chain cooldown: resolution skips releases younger than 2 days (stored as a span, so uv.lock stays stable).
exclude-newer = "2 days"

# The code imports itself as the `docreader` package, so the import root is the repository root.
# The interpreter is the uv environment (`uv sync --project docreader`), not whatever python3 is first on PATH.
[tool.pyrefly]
search-path = [".."]
python-interpreter-path = ".venv/bin/python"
