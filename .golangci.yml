version: "2"
linters:
  enable:
    - lll           # line length
    - govet
    - revive
  settings:
    lll:
      line-length: 120
      tab-width: 4
  exclusions:
    paths:
      # swag embeds OpenAPI as single-line JSON strings; line-length is not meaningful.
      - docs/docs\.go$
    rules:
      # A URL cannot be wrapped.
      - linters: [lll]
        source: '^\s*// https?://\S+$'
formatters:
  enable:
    - gofmt
    - gofumpt
