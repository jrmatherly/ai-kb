          $ref: '#/definitions/internal_handler.storageBackendRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Updated storage backend
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Immutable field, read-only backend, invalid or unreachable
          schema:
            $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_errors.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_errors.ErrorResponse'
        "404":
          description: Storage backend not found
          schema:
            $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_errors.ErrorResponse'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Update storage backend
      tags:
      - StorageBackend
