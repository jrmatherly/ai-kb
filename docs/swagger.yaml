    - connection_config
    - engine_type
    type: object
  internal_handler.TextRelationExtractionRequest:
    properties:
      model_id:
        type: string
      tags:
        items:
          type: string
        type: array
      text:
        type: string
    required:
    - model_id
    - tags
    - text
    type: object
  internal_handler.UpdateAgentRequest:
    properties:
      avatar:
        description: |-
          Avatar travels as a pointer so an omitted field can be told apart from
          an explicit clear: nil keeps the stored avatar, a pointer to "" wipes
          it. As a plain string the two cases were indistinguishable, so a caller
          that PUT only a config silently zeroed the avatar and still got a 200.
        type: string
      config:
        $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.CustomAgentConfig'
      description:
        type: string
      name:
        type: string
    type: object
  internal_handler.UpdateChunkRequest:
    properties:
      content:
        type: string
      expected_revision:
        type: integer
      is_enabled:
        type: boolean
    type: object
  internal_handler.UpdateKnowledgeBaseRequest:
    properties:
      config:
        $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.KnowledgeBaseConfig'
      description:
        type: string
      name:
        type: string
      vlm_config:
        allOf:
        - $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.VLMConfig'
        description: |-
          VLMConfig updates the knowledge base's multimodal (vision) config.
          Optional: nil means "no change", mirroring how CreateKnowledgeBase
          accepts a top-level vlm_config.
    required:
    - name
    type: object
  internal_handler.UpdateKnowledgeRequest:
    properties:
      custom_metadata:
        items:
          type: integer
        type: array
      description:
        type: string
      title:
        type: string
    type: object
  internal_handler.UpdateModelRequest:
    properties:
      description:
        type: string
      display_name:
        type: string
      name:
        type: string
      parameters:
        $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.ModelParameters'
      source:
        $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.ModelSource'
      type:
        $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.ModelType'
    type: object
  internal_handler.UpdateProviderRequest:
    properties:
      description:
        type: string
      is_default:
        type: boolean
      name:
        type: string
      parameters:
        $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.WebSearchProviderParameters'
    type: object
  internal_handler.UpdateStoreRequest:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  internal_handler.UpdateSystemSettingRequest:
    properties:
      value:
        description: |-
          Value is intentionally `any` (decoded as float64 / string / bool /
          etc. by the JSON unmarshaller). Service.encodeForType normalises
          these against the registry's declared type and rejects mismatches.
    type: object
  internal_handler.acceptInvitationByTokenRequest:
    properties:
      token:
        type: string
    required:
    - token
    type: object
  internal_handler.addMemberRequest:
    properties:
      email:
        type: string
      role:
        $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.TenantRole'
    required:
    - email
    - role
    type: object
  internal_handler.addSimilarQuestionsRequest:
    properties:
      similar_questions:
        items:
          type: string
        minItems: 1
        type: array
    required:
    - similar_questions
    type: object
  internal_handler.apiPrincipalConfigRequest:
    properties:
      direct_header_name:
        type: string
      hmac_secret:
        type: string
      mode:
        $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.APIPrincipalMode'
      require_direct_header:
        type: boolean
      signed_token_header_name:
        type: string
    type: object
  internal_handler.apiPrincipalTestTokenRequest:
    properties:
      expires_in_seconds:
        type: integer
      external_user_id:
        type: string
    type: object
  internal_handler.auditLogListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.AuditLog'
        type: array
      next_cursor:
        type: integer
      success:
        type: boolean
    type: object
  internal_handler.batchReparseKnowledgeRequest:
    properties:
      ids:
        items:
          type: string
        type: array
      kb_id:
        type: string
      process_config:
        $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.KnowledgeProcessOverrides'
    required:
    - ids
    - kb_id
    type: object
  internal_handler.createInvitationRequest:
    properties:
      email:
        type: string
      message:
        type: string
      role:
        $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.TenantRole'
    required:
    - email
    - role
    type: object
  internal_handler.createInviteLinkRequest:
    properties:
      message:
        type: string
      role:
        $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.TenantRole'
    required:
    - role
    type: object
  internal_handler.createTenantRequest:
    properties:
      description:
        maxLength: 512
        type: string
      name:
        maxLength: 128
        minLength: 1
        type: string
    required:
    - name
    type: object
  internal_handler.imageListRequestBody:
    properties:
      attr_filters:
        additionalProperties:
          items:
            type: string
          type: array
        type: object
      attr_rules:
        additionalProperties:
          additionalProperties:
            type: string
          type: object
        type: object
      is_enabled:
        type: boolean
      keyword:
        type: string
      knowledge_ids:
        items:
          type: string
        type: array
      page:
        description: Page
        minimum: 1
        type: integer
      page_size:
        description: Page size
        maximum: 1000
        minimum: 1
        type: integer
      search_in:
        items:
          type: string
        type: array
      sort_by:
        type: string
      sort_order:
        type: string
    type: object
  internal_handler.invitationLookupRequest:
    properties:
      token:
        type: string
    required:
    - token
    type: object
  internal_handler.invitationLookupResponse:
    properties:
      expires_at:
        type: string
      role:
        $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.TenantRole'
      tenant_id:
        type: integer
      tenant_name:
        type: string
    type: object
  internal_handler.listResourcesForConfigRequest:
    properties:
      credentials:
        additionalProperties: true
        type: object
      parent_id:
        type: string
      resource_ids:
        items:
          type: string
        type: array
      settings:
        additionalProperties: true
        type: object
      type:
        type: string
    required:
    - credentials
    - type
    type: object
  internal_handler.manualSyncRequest:
    properties:
      allow_mass_deletion:
        description: |-
          AllowMassDeletion lets this run delete past the mass-deletion guard,
          earlier runs' held deletions included. It is never stored on the data source.
        type: boolean
    type: object
  internal_handler.meEnvVarRequest:
    properties:
      name:
        type: string
      sandbox_config_id:
        type: string
      skill_id:
        type: string
      value:
        description: |-
          Value is unused by the delete endpoints. Clearing a value is a delete
          rather than a write of "", so a member always has one unambiguous way to
          revoke.
        type: string
    type: object
  internal_handler.platformAPIKeyCreateRequest:
    properties:
      capabilities:
        items:
          type: string
        type: array
      expires_at_unix:
        type: integer
      name:
        type: string
    type: object
  internal_handler.registerByInviteRequest:
    properties:
      email:
        type: string
      password:
        minLength: 6
        type: string
      token:
        type: string
      username:
        type: string
    required:
    - email
    - password
    - token
    - username
    type: object
  internal_handler.resolveAncestorsRequest:
    properties:
      resource_ids:
        items:
          type: string
        type: array
    type: object
  internal_handler.sandboxConfigRequest:
    properties:
      config:
        $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.TenantSandboxConfig'
      description:
        type: string
      name:
        type: string
    required:
    - name
    type: object
  internal_handler.skillPatchRequest:
    properties:
      enabled:
        description: |-
          Enabled is a pointer because its absence is not a request to disable the
          skill; a body may carry envs instead.
        type: boolean
      envs:
        additionalProperties:
          type: string
        description: |-
          Envs is a pointer to a map because "sent an empty object" and "did not
          mention envs" are different requests: the first clears what it names,
          the second must leave every stored value alone.
        type: object
    type: object
  internal_handler.skillSourceRequest:
    properties:
      source:
        description: |-
          Source is exactly one of: "@owner/slug" or a slash-free slug (ClawHub),
          a github.com / gitlab.com / skills.sh / clawhub / skillhub page URL, a
          ClawHub skills-sh catalog page or "skills-sh:owner/repo/slug" locator, or
          a direct zip/SKILL.md URL. Bare "owner/slug" is rejected: it is both a
          ClawHub id and a GitHub repo. The fetch carries no credential.
        type: string
    type: object
  internal_handler.storageBackendRequest:
    properties:
      config:
        $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.StorageBackendConfig'
      name:
        type: string
      provider:
        type: string
      status:
        type: string
    required:
    - name
    - provider
    type: object
  internal_handler.updateLastFAQImportResultDisplayStatusRequest:
    properties:
      display_status:
        enum:
        - open
        - close
        type: string
    required:
    - display_status
    type: object
  internal_handler.updateMemberRoleRequest:
    properties:
      role:
        $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.TenantRole'
    required:
    - role
    type: object
  internal_handler.updateMyPreferencesRequest:
    properties:
      browser_search_instructions:
        maxLength: 4000
        type: string
      last_active_tenant_id:
        description: |-
          LastActiveTenantID lets clients persist "after a fresh login,
          drop me back into this workspace" across devices. The SPA sends
          this after every tenant switch; POST /auth/switch-tenant records
          the same preference server-side. Send a positive workspace id to
          set / replace, or 0 to clear. Membership is validated at next
          login, not here. Nil = field omitted from the PATCH and stays
          untouched.
        type: integer
    type: object
  internal_handler.updateTenantRequest:
    properties:
      description:
        maxLength: 512
        type: string
      name:
        maxLength: 128
        minLength: 1
        type: string
      slug:
        description: Slug is system-admin only; "" clears it.
        maxLength: 64
        type: string
    type: object
  internal_handler_session.AttachmentUpload:
    properties:
      data:
        description: Base64-encoded file content
        type: string
      file_name:
        description: Original filename
        type: string
      file_size:
        description: File size in bytes
        type: integer
    type: object
  internal_handler_session.CreateKnowledgeQARequest:
    properties:
      agent_enabled:
        description: Whether agent mode is enabled for this request
        type: boolean
      agent_id:
        description: Selected custom agent ID (backend resolves shared agent and its
          workspace from share relation)
        type: string
      agent_source_tenant_id:
        description: Optional disambiguator; backend still verifies the share relation
        type: integer
      attachment_ids:
        description: Pre-uploaded session-scoped document IDs
        items:
          type: string
        type: array
      attachment_uploads:
        description: Attached files (documents, audio, etc.)
        items:
          $ref: '#/definitions/internal_handler_session.AttachmentUpload'
        type: array
      channel:
        description: 'Source channel: "web", "api", "im", etc.'
        type: string
      disable_title:
        description: Whether to disable auto title generation
        type: boolean
      images:
        description: Attached images for multimodal chat
        items:
          $ref: '#/definitions/internal_handler_session.ImageAttachment'
        type: array
      knowledge_base_ids:
        description: Selected knowledge base ID for this request
        items:
          type: string
        type: array
      knowledge_ids:
        description: Selected knowledge ID for this request
        items:
          type: string
        type: array
      local_browser_enabled:
        description: Browser source
        type: boolean
      mcp_service_ids:
        description: Per-request MCP services selected via @mention
        items:
          type: string
        type: array
      mentioned_items:
        description: '@mentioned knowledge bases and files'
        items:
          $ref: '#/definitions/internal_handler_session.MentionedItemRequest'
        type: array
      query:
        description: Query text; may be empty only when an image or file is attached
        type: string
      question_origin:
        allOf:
        - $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.QuestionOrigin'
        description: QuestionOrigin is the knowledge source of a picked suggested
          question.
      reasoning_effort:
        description: ReasoningEffort overrides thinking for this request; empty inherits
          the agent configuration.
        type: string
      skill_names:
        description: Per-request Skills selected via @mention
        items:
          type: string
        type: array
      suggestion_attribution:
        $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.SuggestionAttribution'
      summary_model_id:
        description: Optional summary model ID for this request (overrides session
          default)
        type: string
      tag_ids:
        description: '@mentioned tag IDs (display/debug; scoped via MentionedItems)'
        items:
          type: string
        type: array
      web_search_enabled:
        description: Whether web search is enabled for this request
        type: boolean
    type: object
  internal_handler_session.CreateSessionRequest:
    properties:
      description:
        description: Description for the session (optional)
        type: string
      project_dir:
        description: |-
          ProjectDir is an optional Lite host-sandbox binding. When set it must
          be an absolute path already present in the user-approved ProjectDirs
          list. Empty means the session gets an auto-allocated workspace.
        type: string
      title:
        description: Title for the session (optional)
        type: string
    type: object
  internal_handler_session.ForkSessionRequest:
    properties:
      message_id:
        description: |-
          MessageID is the message to branch at. A user message copies history
          strictly before it (the client prefills that question). An assistant
          message copies history through that answer so the branch continues after it.
        type: string
      title:
        description: Title is optional. Empty falls back to the source title plus
          a suffix.
        type: string
    required:
    - message_id
    type: object
  internal_handler_session.GenerateTitleRequest:
    properties:
      messages:
        description: Messages to use as context for title generation
        items:
          $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.Message'
        type: array
    required:
    - messages
    type: object
  internal_handler_session.ImageAttachment:
    properties:
      caption:
        description: VLM analysis result (context-aware, single call)
        type: string
      data:
        description: base64 data URI from frontend (data:image/png;base64,...)
        type: string
      url:
        description: serving URL after saving to storage
        type: string
    type: object
  internal_handler_session.MentionedItemRequest:
    properties:
      id:
        type: string
      kb_id:
        description: Parent knowledge base for file/tag mentions
        type: string
      kb_name:
        description: Display name for parent KB
        type: string
      kb_type:
        description: '"document" or "faq" (only for kb type)'
        type: string
      name:
        type: string
      service_id:
        description: Parent MCP service for MCP tool mentions
        type: string
      skill_name:
        description: Preloaded agent skill name
        type: string
      type:
        description: '"kb", "file", "tag", "mcp", "skill"'
        type: string
    type: object
  internal_handler_session.RewindSessionRequest:
    properties:
      message_id:
        description: |-
          MessageID is the message to rewind to. A user message deletes itself and
          everything after (the client prefills that question). An assistant
          message keeps itself and deletes everything after.
        type: string
    required:
    - message_id
    type: object
  internal_handler_session.SearchKnowledgeRequest:
    properties:
      disable_keywords_match:
        description: Vector recall only
        type: boolean
      disable_vector_match:
        description: Keyword recall only
        type: boolean
      keyword_threshold:
        description: Minimum keyword score
        type: number
      knowledge_base_id:
        description: Single knowledge base ID (for backward compatibility)
        type: string
      knowledge_base_ids:
        description: IDs of knowledge bases to search (multi-KB support)
        items:
          type: string
        type: array
      knowledge_ids:
        description: IDs of specific knowledge (files) to search
        items:
          type: string
        type: array
      match_count:
        description: Number of results to return
        type: integer
      mentioned_items:
        description: Optional scoped tag mentions
        items:
          $ref: '#/definitions/internal_handler_session.MentionedItemRequest'
        type: array
      query:
        description: Query text to search for
        type: string
      rerank:
        allOf:
        - $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.RerankOptions'
        description: Rerank override
      tag_ids:
        description: Tag IDs for filtering within a single KB
        items:
          type: string
        type: array
      vector_threshold:
        description: Optional overrides of the tenant retrieval config. Omitted fields
          keep it.
        type: number
    required:
    - query
    type: object
  internal_handler_session.SteerMessageRequest:
    properties:
      channel:
        type: string
      delivery:
        description: Delivery is "after" (default) or "inject". See the constants
          above.
        type: string
      expected_assistant_message_id:
        description: |-
          Optional for older clients. New clients pin delivery to the run they see
          and supply a stable ID so a consume event may precede the HTTP response.
        type: string
      mentioned_items:
        items:
          $ref: '#/definitions/internal_handler_session.MentionedItemRequest'
        type: array
      query:
        type: string
      steer_id:
        type: string
    required:
    - query
    type: object
  internal_handler_session.StopSessionRequest:
    properties:
      message_id:
        type: string
    required:
    - message_id
    type: object
  internal_handler_session.batchDeleteRequest:
    properties:
      delete_all:
        type: boolean
      ids:
        items:
          type: string
        type: array
    type: object
info:
  contact:
    name: AI KB Github
    url: https://github.com/jrmatherly/ai-kb
  description: AI KB knowledge base management API
  termsOfService: http://swagger.io/terms/
  title: AI KB API
  version: "1.0"
paths:
  /agent-chat/{session_id}:
    post:
      consumes:
      - application/json
      description: Agent-based question answering with multi-turn conversation and
        SSE streaming
      parameters:
      - description: Session ID
        in: path
        name: session_id
        required: true
        type: string
      - description: QA request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler_session.CreateKnowledgeQARequest'
      - default: handle
        description: 'public: direct links'
        enum:
        - handle
        - public
        in: query
        name: resource_urls
        type: string
      produces:
      - text/event-stream
      responses:
        "200":
          description: QA result (SSE stream)
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request parameters
          schema:
            $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_errors.ErrorResponse'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Agent QA
      tags:
      - QA
  /agent/mcp-oauth-resolutions/{pending_id}:
    post:
      consumes:
      - application/json
      description: |-
        Called after the user completes OAuth in a conversation. Checks that the token exists, then resumes the
        agent's paused tool call
      parameters:
      - description: Pending authorization ID
        in: path
        name: pending_id
        required: true
        type: string
      - description: '{service_id: string}'
        in: body
        name: request
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_errors.ErrorResponse'
        "409":
          description: The user has not completed authorization
          schema:
            $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_errors.ErrorResponse'
      security:
      - Bearer: []
      summary: Complete in-chat MCP OAuth authorization
      tags:
      - MCP Services
  /agent/mcp-oauth-resolutions/{pending_id}/cancel:
    post:
      description: The user skips OAuth authorization, unblocking the agent
      parameters:
      - description: Pending authorization ID
        in: path
        name: pending_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_errors.ErrorResponse'
      security:
      - Bearer: []
      summary: Skip in-chat MCP OAuth authorization
      tags:
      - MCP Services
  /agent/tool-approvals/{pending_id}:
    post:
      consumes:
      - application/json
      description: The user approves or rejects one tool call (used while the agent
        blocks waiting for approval)
      parameters:
      - description: Pending approval ID
        in: path
        name: pending_id
        required: true
        type: string
      - description: '{decision: \'
        in: body
        name: request
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Approval result
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request parameters
          schema:
            $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_errors.ErrorResponse'
        "404":
          description: Pending approval not found
          schema:
            $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_errors.ErrorResponse'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Resolve a pending MCP tool call approval
      tags:
      - MCP Services
  /agents:
    get:
      consumes:
      - application/json
      description: List all agents in the current workspace, built-in agents included
      produces:
      - application/json
      responses:
        "200":
          description: Agent list
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_errors.ErrorResponse'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: List agents
      tags:
      - Agents
    post:
      consumes:
      - application/json
      description: Create a new custom agent
      parameters:
      - description: Agent details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.CreateAgentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created agent
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request parameters
          schema:
            $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_errors.ErrorResponse'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Create agent
      tags:
      - Agents
  /agents/{id}:
    delete:
      consumes:
      - application/json
      description: Delete the specified agent
      parameters:
      - description: Agent ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Deleted
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request parameters
