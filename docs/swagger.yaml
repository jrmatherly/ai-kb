        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.updateMemberRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      summary: Change workspace member role
      tags:
      - Workspace Members
