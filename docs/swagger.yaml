        "400":
          description: Backend is default, bound, read-only, or legacy alias
          schema:
            $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_errors.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_errors.ErrorResponse'
        "404":
          description: Storage backend not found
          schema:
            $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_errors.ErrorResponse'
      security:
      - Bearer: []
      - ApiKeyAuth: []
