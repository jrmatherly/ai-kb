      bbox:
        description: |-
          BBox is [x0, y0, x1, y1] as fractions of the page width and height,
          origin at the top-left corner of the rendered page.
        items:
          type: number
        type: array
      block:
        description: Block is the 1-based index among a Word file's body paragraphs
          and tables.
        type: integer
      end:
        type: integer
      end_ms:
        type: integer
      mapping:
        description: Mapping records verified text-to-source alignment. Empty means
          legacy.
        type: string
      page:
        description: Page is the 1-based PDF page.
        type: integer
      partial:
        description: Partial means some of the chunk has no source mapping.
        type: boolean
      quote:
        description: |-
          Quote is the complete cited overlap as parsed. Viewers match it
          inside the rendered original and against the
          answer sentence that cites the chunk.
        type: string
      row_end:
        type: integer
      row_start:
        type: integer
      section:
        description: Section is the 1-based EPUB spine index.
        type: integer
      sheet:
        description: |-
          Sheet is the spreadsheet sheet name; RowStart/RowEnd are its 1-based
          row numbers as shown by spreadsheet applications.
        type: string
      slide:
        description: Slide is the 1-based slide number in presentation order.
        type: integer
      source_hash:
        description: SourceHash binds the locator to the knowledge record’s source
          revision hash.
        type: string
      source_id:
        description: SourceID identifies a block within the parser result, not a rendered
          item.
        type: string
      start:
        description: Start/End are rune offsets into the original text file.
        type: integer
      start_ms:
        description: StartMs/EndMs bound an audio segment.
        type: integer
      title:
        description: Title names the section or slide when the source has one.
        type: string
      type:
        type: string
    type: object
