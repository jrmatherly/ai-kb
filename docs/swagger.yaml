  github_com_jrmatherly_ai-kb_internal_types.CubeEgressRule:
    properties:
      audit:
        description: Audit is none | metadata | full. Empty uses the server default.
        type: string
      deny:
        description: |-
          Deny inverts the action, which defaults to allow. A deny rule still
          needs Host or SNI: the target has to reach CubeEgress for it to answer
          with a request-level 403 instead of the network layer dropping it.
        type: boolean
      host:
        type: string
      inject:
        description: Inject adds credential headers on allowed HTTPS requests.
        items:
          $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.CubeHeaderInject'
        type: array
      methods:
        items:
          type: string
        type: array
      name:
        type: string
      path:
        type: string
      scheme:
        type: string
      sni:
        type: string
    type: object
  github_com_jrmatherly_ai-kb_internal_types.CubeHeaderInject:
    properties:
      format:
        type: string
      header:
        type: string
      secret:
        type: string
    type: object
  github_com_jrmatherly_ai-kb_internal_types.CubeSandboxConfig:
    properties:
      api_key:
        description: encrypted
        type: string
      api_url:
        type: string
      cube_sandbox_ttl_seconds:
        type: integer
      dns_servers:
        description: DNSServers are Cube template nameserver IPs. Empty uses Cubelet's
          default.
        items:
          type: string
        type: array
      http_timeout_sec:
        description: |-
          HTTPTimeoutSec bounds each HTTP call to the sandbox control plane.
          0 means use the built-in default (30s), never the deployment's value.
        type: integer
      proxy_url:
        type: string
      sandbox_domain:
        type: string
      template_id:
        type: string
    type: object
  github_com_jrmatherly_ai-kb_internal_types.CustomAgentConfig:
    properties:
      agent_mode:
        description: |-
          ===== Basic Settings =====
          Agent mode: "quick-answer" for RAG mode, "smart-reasoning" for ReAct agent mode
        type: string
      agent_type:
        description: |-
          AgentType is a preset category under smart-reasoning mode that pre-fills
          system prompt, allowed tools and recommended KB compatibility.
          Valid values: "rag-qa", "wiki-qa", "hybrid-rag-wiki", "custom".
          Empty / unknown values are treated as "custom" (no preset applied).
          Ignored for quick-answer mode.
        type: string
      allowed_tools:
        description: Allowed tools (only for agent type)
        items:
          type: string
        type: array
      asr_model_id:
        description: ASR model ID for audio transcription (optional)
        type: string
      attachment_image_understanding:
        description: |-
          AttachmentImageUnderstanding enables VLM OCR fallback for image-only /
          scanned documents (PDF/PPT whose pages are images). Disabled by default
          because it materially increases parse latency; only triggers when the
          extracted text is below a threshold and a VLM model is configured.
        type: boolean
      attachment_ocr_max_pages:
        description: |-
          AttachmentOCRMaxPages caps how many pages of a scanned / image-only
          document this agent sends to the VLM for OCR. 0 falls back to the global
          default (AIKB_CHAT_ATTACHMENT_OCR_MAX_PAGES). More pages means higher
          coverage but slower parsing and more VLM cost.
        type: integer
      attachment_parse_wait_timeout_sec:
        description: |-
          AttachmentParseWaitTimeoutSec bounds, in seconds, how long a chat turn
          waits for this agent's still-parsing attachments before proceeding with
          only the finished ones. 0 falls back to the global default
          (AIKB_CHAT_ATTACHMENT_WAIT_TIMEOUT_SEC).
        type: integer
      audio_upload_enabled:
        description: 'Whether audio upload (ASR transcription) is enabled for this
          agent (default: false)'
        type: boolean
      chat_parser_engine_rules:
        description: |-
          ===== Chat Attachment Parsing Settings =====
          ChatParserEngineRules selects parser engines for session-scoped chat
          attachments by file type. Takes precedence over the tenant-level
          ParserEngineConfig.ChatParserEngineRules; an explicit per-request
          parser_engine still overrides both.
        items:
          $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.ParserEngineRule'
        type: array
      citation_enabled:
        description: |-
          Whether final answers include knowledge/web source citations. Nil defaults to true
          so agents saved before this option was introduced keep their existing behavior.
        type: boolean
      context_template:
        description: Context template for normal mode (how to format retrieved chunks)
        type: string
      context_template_id:
        description: |-
          ContextTemplateID references a template ID in prompt_templates/ YAML files.
          If set and ContextTemplate is empty, the template content is resolved at request time for saved agents.
        type: string
      data_analysis_enabled:
        description: |-
          ===== Data Analysis Settings =====
          Whether to run the legacy in-pipeline DuckDB SQL data-analysis stage when
          the retrieved chunks include CSV/Excel files. This issues an extra LLM
          call to generate a SQL query and is disabled by default because most
          quick-answer / RAG-style agents do not want the added latency.
        type: boolean
      embedding_top_k:
        description: |-
          ===== Retrieval Strategy Settings (for both modes) =====
          Embedding/Vector retrieval top K
        type: integer
      enable_query_expansion:
        description: |-
          ===== Advanced Settings (mainly for normal mode) =====
          Whether to enable query expansion
        type: boolean
      enable_rewrite:
        description: Whether to enable query rewrite for multi-turn conversations
        type: boolean
      fallback_prompt:
        description: Fallback prompt (when FallbackStrategy is "model")
        type: string
      fallback_response:
        description: Fixed fallback response (when FallbackStrategy is "fixed")
        type: string
      fallback_strategy:
        description: 'Fallback strategy: "fixed" for fixed response, "model" for model
          generation'
        type: string
      faq_direct_answer_threshold:
        description: FAQ direct answer threshold - if similarity > this value, use
          FAQ answer directly
        type: number
      faq_priority_enabled:
        description: |-
          ===== FAQ Strategy Settings =====
          Whether FAQ priority strategy is enabled (FAQ answers prioritized over document chunks)
        type: boolean
      faq_score_boost:
        description: FAQ score boost multiplier - FAQ results score multiplied by
          this factor
        type: number
      history_turns:
        description: Number of history turns to keep in context. Quick-answer only;
          smart-reasoning sizes history by context window
        type: integer
      image_storage_provider:
        description: |-
          Storage provider for image uploads: "local", "minio", "cos", "tos", "s3", "oss", "ks3".
          Empty means use the global/workspace default provider.
        type: string
      image_upload_enabled:
        description: |-
          ===== Image Upload / Multimodal Settings =====
          Whether image upload is enabled for this agent (default: false)
        type: boolean
      intent_prompts:
        additionalProperties:
          type: string
        description: |-
          IntentPrompts holds per-intent system prompt overrides for non-retrieval
          intents (greeting, chitchat, etc.). Empty values fall back to templates
          under config/prompt_templates/intent_prompts.yaml.
        type: object
      kb_selection_mode:
        description: |-
          ===== Knowledge Base Settings =====
          Knowledge base selection mode: "all" = all KBs, "selected" = specific KBs, "none" = no KB
        type: string
      keyword_threshold:
        description: Keyword retrieval threshold
        type: number
      knowledge_bases:
        description: Associated knowledge base IDs (only used when KBSelectionMode
          is "selected")
        items:
          type: string
        type: array
      llm_call_timeout:
        description: Timeout for a single LLM call in seconds (0 = use global default)
        type: integer
      max_completion_tokens:
        description: |-
          Maximum completion tokens. Quick-answer uses this for the RAG answer.
          Smart-reasoning ReAct rounds send this value as-is (zero becomes
          DefaultMaxCompletionTokens at call time: 4096, or 24576 with a sandbox).
        type: integer
      max_iterations:
        description: |-
          ===== Agent Mode Settings =====
          Maximum iterations for the ReAct loop. Zero is unset (filled with a
          default). A negative value is unlimited: the loop runs until the model
          stops, the user cancels, or another guard fires.
        type: integer
      mcp_auth_wait_timeout:
        description: |-
          MCPAuthWaitTimeout is how many seconds to wait for in-conversation OAuth
          authorization before skipping. <=0 uses the gate's configured timeout.
        type: integer
      mcp_selection_mode:
        description: 'MCP service selection mode: "all" = all enabled MCP services,
          "selected" = specific services, "none" = no MCP'
        type: string
      mcp_services:
        description: Selected MCP service IDs (only used when MCPSelectionMode is
          "selected")
        items:
          type: string
        type: array
      memory_enabled:
        description: |-
          Whether this agent may read the user's long-term memory. Nil inherits
          the workspace setting; false opts a single agent out of memory even when
          the workspace has it on. There is no "on" that overrides the workspace.
        type: boolean
      model_id:
        description: |-
          ===== Model Settings =====
          Model ID to use for conversations
        type: string
      multi_turn_enabled:
        description: |-
          ===== Multi-turn Conversation Settings =====
          Whether multi-turn conversation is enabled
        type: boolean
      query_understand_model_id:
        description: |-
          Dedicated chat model ID for the query-understanding (rewrite + intent) step.
          When empty, the main conversation ModelID is used as a fallback.
        type: string
      question_suggestions:
        allOf:
        - $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.QuestionSuggestionConfig'
        description: |-
          ===== Conversation Question Suggestions =====
          QuestionSuggestions owns both the static/knowledge-backed prompts shown
          before the first user turn and the contextual follow-up questions shown
          after a completed assistant answer.
      reasoning_effort:
        description: |-
          ReasoningEffort selects the thinking intensity (off | auto | minimal |
          low | medium | high | xhigh | max). Empty keeps the boolean Thinking
          semantics: true means "auto". See internal/models/api.ReasoningEffort.
        type: string
      rerank_model_id:
        description: ReRank model ID for retrieval
        type: string
      rerank_threshold:
        description: Rerank threshold
        type: number
      rerank_top_k:
        description: Rerank top K
        type: integer
      retain_retrieval_history:
        description: Whether to retain retrieval history across turns
        type: boolean
      retrieve_kb_only_when_mentioned:
        description: |-
          Whether to retrieve knowledge base only when explicitly mentioned with @ (default: false)
          When true, knowledge base retrieval only happens if user explicitly mentions KB/files with @
          When false, knowledge base retrieval happens according to KBSelectionMode
        type: boolean
      rewrite_prompt_system:
        description: Rewrite prompt system message
        type: string
      rewrite_prompt_user:
        description: Rewrite prompt user message template
        type: string
      sandbox_config_id:
        description: |-
          ===== Sandbox Settings =====
          SandboxConfigID selects which workspace sandbox config this agent's
          skill scripts run on. Empty means sandbox execution is disabled.

          This references the LOGICAL config, never a specific revision: keeping
          the indirection here is what would let credential rotation happen
          without re-pointing every agent (see the spec's §4.8).
        type: string
      selected_skills:
        description: Selected skill names (only used when SkillsSelectionMode is "selected")
        items:
          type: string
        type: array
      skills_selection_mode:
        description: |-
          ===== Skills Settings (only for smart-reasoning mode) =====
          Skills selection mode: "all" = all installed skills, "selected" = specific skills, "none" = no skills
        type: string
      supported_file_types:
        description: |-
          ===== File Type Restriction Settings =====
          Supported file types for this agent (e.g., ["csv", "xlsx", "xls"])
          Empty means all file types are supported
          When set, only files with matching extensions can be used with this agent
        items:
          type: string
        type: array
      system_prompt:
        description: System prompt for the agent (unified prompt, uses web_search_status
          placeholder for dynamic behavior)
        type: string
      system_prompt_id:
        description: |-
          SystemPromptID references a template ID in prompt_templates/ YAML files.
          If set and SystemPrompt is empty, the template content is resolved at request time for saved agents.
        type: string
      temperature:
        description: Temperature for LLM (0-1)
        type: number
      thinking:
        description: Whether to enable thinking mode (for models that support extended
          thinking)
        type: boolean
      vector_threshold:
        description: Vector retrieval threshold
        type: number
      vlm_model_id:
        description: VLM model ID for image analysis (optional, falls back to workspace-level
          VLM)
        type: string
      web_fetch_enabled:
        description: Whether to auto-fetch full page content for reranked web search
          results
        type: boolean
      web_fetch_top_n:
        description: 'Max number of pages to fetch after rerank (default: 3)'
        type: integer
      web_search_enabled:
        description: |-
          ===== Web Search Settings =====
          Whether web search is enabled
        type: boolean
      web_search_max_results:
        description: Maximum web search results
        type: integer
      web_search_provider_id:
        description: |-
          WebSearchProviderID references a specific WebSearchProviderEntity.
          If empty, the workspace's default provider (is_default=true) is used.
        type: string
    type: object
  github_com_jrmatherly_ai-kb_internal_types.DataSource:
    properties:
      config:
        description: |-
          Encrypted configuration (API credentials, tokens, etc.)
          Stored as JSON with AES-256-GCM encryption
        items:
          type: integer
        type: array
      conflict_strategy:
        description: 'Conflict resolution strategy: overwrite or skip'
        type: string
      created_at:
        description: Creation timestamp
        type: string
      deleted_at:
        allOf:
        - $ref: '#/definitions/gorm.DeletedAt'
        description: Soft delete timestamp
      error_message:
        description: Error message if status is "error"
        type: string
      id:
        description: Unique identifier
        type: string
      knowledge_base_id:
        description: Target knowledge base ID
        type: string
      last_sync_at:
        description: Last successful sync timestamp
        type: string
      last_sync_cursor:
        description: Cursor or state for incremental sync (connector-specific)
        items:
          type: integer
        type: array
      last_sync_result:
        description: Summary of last sync result
        items:
          type: integer
        type: array
      latest_sync_log:
        allOf:
        - $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.SyncLog'
        description: Latest sync log (not stored in DB, populated on query)
      name:
        description: User-friendly name
        type: string
      status:
        description: 'Current status: active, paused, error'
        type: string
      sync_deletions:
        description: Whether to sync deletions from source
        type: boolean
      sync_log_retention_days:
        description: 'Number of days to keep sync logs (default: 30)'
        type: integer
      sync_mode:
        description: 'Sync mode: "incremental" (recommended) or "full"'
        type: string
      sync_schedule:
        description: Cron expression for scheduled syncs (e.g., "0 */6 * * *" = every
          6 hours)
        type: string
      tenant_id:
        description: Workspace ID for multi-workspace isolation
        type: integer
      total_items_synced:
        description: Total items synced (not stored in DB, calculated on query)
        type: integer
      type:
        description: Connector type (feishu, notion, confluence, etc.)
        type: string
      updated_at:
        description: Last update timestamp
        type: string
    type: object
  github_com_jrmatherly_ai-kb_internal_types.DockerSandboxConfig:
    properties:
      cpu_limit:
        description: |-
          CPULimit is the number of CPU cores one sandbox may use. 0 uses the
          built-in default.
        type: number
      host:
        description: |-
          Host is the daemon endpoint in DOCKER_HOST form. Empty means the local
          unix socket.
        type: string
      http_timeout_sec:
        description: HTTPTimeoutSec bounds each Engine API call. 0 uses the built-in
          default.
        type: integer
      idle_ttl_seconds:
        description: |-
          IdleTTLSeconds is how long a session container may go unused before it
          is reclaimed. The daemon has no idle timeout of its own, so this is what
          stops an abandoned session from pinning host memory indefinitely.
        type: integer
      image:
        type: string
      memory_limit_mb:
        description: MemoryLimitMB caps one sandbox's memory. 0 uses the built-in
          default.
        type: integer
      network_mode:
        description: |-
          NetworkMode is the Docker network sandboxes join: "bridge" (default) or
          "none" for no egress. Nothing else is accepted - host and container:
          modes share another namespace outright, and a named network is usually
          the deployment's own compose network, which would put the sandbox next
          to Postgres and Redis.
        type: string
      pids_limit:
        description: |-
          PidsLimit caps how many processes one sandbox may run. 0 uses the
          built-in default.
        type: integer
      runtime:
        description: |-
          Runtime selects an alternative OCI runtime such as "runsc" (gVisor).
          Empty uses the daemon default.
        type: string
      tls_cert_path:
        description: |-
          TLSCertPath is a directory on the AI KB host containing ca.pem,
          cert.pem and key.pem. Required when Host is a TCP endpoint.
        type: string
    type: object
  github_com_jrmatherly_ai-kb_internal_types.E2BHostRule:
    properties:
      headers:
        additionalProperties:
          type: string
        description: |-
          Headers values are credentials and are encrypted at rest; names stay
          readable so operators can see which headers are injected.
        type: object
      host:
        type: string
    type: object
  github_com_jrmatherly_ai-kb_internal_types.E2BSandboxConfig:
    properties:
      api_key:
        description: encrypted
        type: string
      api_url:
        type: string
      e2b_sandbox_ttl_seconds:
        type: integer
      http_timeout_sec:
        description: |-
          HTTPTimeoutSec bounds each HTTP call to the sandbox control plane.
          0 means use the built-in default (30s), never the deployment's value.
        type: integer
      proxy_url:
        description: |-
          ProxyURL is the data-plane gateway that fronts envd. E2B Cloud resolves
          "<port>-<sandboxID>.<sandbox_domain>" through public DNS and TLS, so it
          needs no value here. Self-hosted E2B-compatible control planes usually
          serve every sandbox from one gateway address and expect the sandbox
          authority in the Host header; setting this makes AI KB dial the
          gateway directly instead of requiring wildcard DNS and a certificate
          for the sandbox domain. An "http://" gateway also downgrades the
          data-plane scheme, which the E2B SDK otherwise pins to https.
        type: string
      sandbox_domain:
        type: string
      template_id:
        type: string
    type: object
  github_com_jrmatherly_ai-kb_internal_types.EmbeddingParameters:
    properties:
      dimension:
        type: integer
      supports_dimension_override:
        type: boolean
      truncate_prompt_tokens:
        type: integer
    type: object
  github_com_jrmatherly_ai-kb_internal_types.ExtractConfig:
    properties:
      custom_instructions:
        description: |-
          CustomInstructions adds domain-specific extraction guidance while the
          system keeps ownership of the structured graph output protocol.
        type: string
      enabled:
        type: boolean
      nodes:
        items:
          $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.GraphNode'
        type: array
      relations:
        items:
          $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.GraphRelation'
        type: array
      tags:
        items:
          type: string
        type: array
      text:
        type: string
    type: object
  github_com_jrmatherly_ai-kb_internal_types.FAQBatchUpsertPayload:
    properties:
      dry_run:
        description: validate only, import nothing
        type: boolean
      entries:
        items:
          $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.FAQEntryPayload'
        type: array
      knowledge_id:
        type: string
      mode:
        enum:
        - append
        - replace
        type: string
      task_id:
        description: optional; a UUID is generated when empty
        type: string
    required:
    - entries
    type: object
  github_com_jrmatherly_ai-kb_internal_types.FAQConfig:
    properties:
      index_mode:
        $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.FAQIndexMode'
      question_index_mode:
        $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.FAQQuestionIndexMode'
    type: object
  github_com_jrmatherly_ai-kb_internal_types.FAQEntryFieldsBatchUpdate:
    properties:
      by_id:
        additionalProperties:
          $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.FAQEntryFieldsUpdate'
        description: ByID updates by entry, keyed by entry ID (seq_id)
        type: object
      by_tag:
        additionalProperties:
          $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.FAQEntryFieldsUpdate'
        description: ByTag updates by tag, keyed by TagID (seq_id)
        type: object
      exclude_ids:
        description: ExcludeIDs are entry IDs (seq_id) the ByTag update skips
        items:
          type: integer
        type: array
    type: object
  github_com_jrmatherly_ai-kb_internal_types.FAQEntryFieldsUpdate:
    properties:
      is_enabled:
        type: boolean
      is_recommended:
        type: boolean
      tag_id:
        type: integer
    type: object
  github_com_jrmatherly_ai-kb_internal_types.FAQEntryPayload:
    properties:
      answer_strategy:
        $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.AnswerStrategy'
      answers:
        items:
          type: string
        type: array
      id:
        description: |-
          ID is optional; data migrations use it to set seq_id (must be below the
          auto-increment start, 100000000).
        type: integer
      is_enabled:
        type: boolean
      is_recommended:
        type: boolean
      negative_questions:
        items:
          type: string
        type: array
      similar_questions:
        items:
          type: string
        type: array
      standard_question:
        type: string
      tag_id:
        type: integer
      tag_name:
        type: string
    required:
    - standard_question
    type: object
  github_com_jrmatherly_ai-kb_internal_types.FAQIndexMode:
    enum:
    - question_only
    - question_answer
    type: string
    x-enum-varnames:
    - FAQIndexModeQuestionOnly
    - FAQIndexModeQuestionAnswer
  github_com_jrmatherly_ai-kb_internal_types.FAQQuestionIndexMode:
    enum:
    - combined
    - separate
    type: string
    x-enum-varnames:
    - FAQQuestionIndexModeCombined
    - FAQQuestionIndexModeSeparate
  github_com_jrmatherly_ai-kb_internal_types.FAQSearchRequest:
    properties:
      first_priority_tag_ids:
        description: first-priority tag IDs; limit the hit range, highest priority
        items:
          type: integer
        type: array
      match_count:
        type: integer
      only_recommended:
        description: return recommended entries only
        type: boolean
      query_text:
        type: string
      second_priority_tag_ids:
        description: second-priority tag IDs; limit the hit range, below first priority
        items:
          type: integer
        type: array
      vector_threshold:
        type: number
    required:
    - query_text
    type: object
  github_com_jrmatherly_ai-kb_internal_types.FollowUpSuggestionConfig:
    properties:
      additional_instruction:
        type: string
      allow_regenerate:
        type: boolean
      categories:
        items:
          type: string
        type: array
      count:
        type: integer
      enabled:
        type: boolean
      knowledge_fallback:
        type: boolean
      max_context_turns:
        type: integer
      mode:
        type: string
      model_id:
        type: string
      suppress_on_fallback:
        type: boolean
      suppress_when_answer_asks_question:
        type: boolean
    type: object
  github_com_jrmatherly_ai-kb_internal_types.GalleryUserPrefs:
    properties:
      mode:
        description: |-
          Mode is "all" (every search-eligible field active) or "custom"
          (per-field Status governs). Empty = "all".
        type: string
      status:
        additionalProperties:
          type: string
        description: |-
          Status maps a namespaced attribute id ("builtin:caption") to
          "on"/"off". Only consulted in custom mode; an unrecorded field is
          off. Source-declared on/off does not exist - activation is always
          the user's own record.
        type: object
    type: object
  github_com_jrmatherly_ai-kb_internal_types.GraphNode:
    properties:
      attributes:
        items:
          type: string
        type: array
      chunks:
        items:
          type: string
        type: array
      name:
        type: string
    type: object
  github_com_jrmatherly_ai-kb_internal_types.GraphRelation:
    properties:
      node1:
        type: string
      node2:
        type: string
      type:
        type: string
    type: object
  github_com_jrmatherly_ai-kb_internal_types.ImageActionsConfig:
    properties:
      ocr:
        $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.ImageOCRAction'
    type: object
  github_com_jrmatherly_ai-kb_internal_types.ImageAttrCondition:
    properties:
      is:
        type: string
      prop:
        type: string
    type: object
  github_com_jrmatherly_ai-kb_internal_types.ImageOCRAction:
    properties:
      "on":
        description: |-
          On is the list of attribute conditions that enable OCR. Matching any one
          turns OCR on.
        items:
          $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.ImageAttrCondition'
        type: array
      on_unobserved:
        description: |-
          OnUnobserved is the OCR decision used when the observation does not
          answer for one of the attributes the policy reads - the attribute is
          absent because the model skipped the line, or because the value it wrote
          was not one of the allowed ones. The default is true: an incomplete
          observation keeps extracting, so a missed block of text costs one extra
          call instead of being lost. Turn it off only with a model reliable enough
          to answer every attribute line.
        type: boolean
    type: object
  github_com_jrmatherly_ai-kb_internal_types.ImageProcessingConfig:
    properties:
      image_actions:
        allOf:
        - $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.ImageActionsConfig'
        description: |-
          ImageActions overrides the built-in attribute→work table (see
          DefaultImageActions). A nil value keeps the conservative default: run OCR
          for block text, data visuals, and unobserved images.
      image_attrs_enabled:
        description: |-
          ImageAttrsEnabled turns the attribute-observed image pipeline on for this
          knowledge base. It is off by default on purpose, so upgrading an
          existing deployment never changes what happens to documents already
          being ingested: with it off every image is described and OCR'd exactly
          as before. When on, the describe round also observes image attributes and
          the attribute policy decides whether OCR runs for it. A single upload can
          override it per document through
          KnowledgeProcessOverrides.ImageAttrsEnabled.
        type: boolean
      image_vector_enabled:
        description: |-
          ImageVectorEnabled lets a knowledge base whose embedding model takes
          images index each image by its own vector and recall it with one. It
          is off by default on purpose: a model that takes images is also used
          for plain text, and turning this on costs an embedding call per image
          and widens vector recall. Existing knowledge bases stay off after an
          upgrade because the stored JSON has no such key.
        type: boolean
      model_id:
        description: Model ID
        type: string
    type: object
  github_com_jrmatherly_ai-kb_internal_types.IndexConfig:
    properties:
      buckets_num:
        description: 'Doris: number of buckets per table (DISTRIBUTED BY HASH ...
          BUCKETS N)'
        type: integer
      collection_name:
        description: Milvus
        type: string
      collection_prefix:
        description: Qdrant, Weaviate
        type: string
      desired_shard_count:
        description: 'Weaviate: number of shards per collection'
        type: integer
      hnsw_ef_construction:
        description: 'OpenSearch: HNSW index-build candidate list size'
        type: integer
      hnsw_ef_search:
        description: 'OpenSearch: HNSW search candidate list size (faiss; lucene reads
          at query time)'
        type: integer
      hnsw_m:
        description: |-
          --- OpenSearch k-NN HNSW fields ---
          All omitempty so other engines' serialized IndexConfig is unchanged.
          Zero / empty values fall back to the driver defaults in buildInternalCfg.
        type: integer
      index_name:
        description: '--- Existing fields ---'
        type: string
      knn_engine:
        description: 'OpenSearch: k-NN backend ("lucene" | "faiss")'
        type: string
      number_of_replicas:
        description: ES, OpenSearch
        type: integer
      number_of_shards:
        description: ES, OpenSearch
        type: integer
      replica_number:
        description: Milvus LoadCollection / Tencent VectorDB CreateCollection replicas
        type: integer
      replication_factor:
        description: 'Qdrant, Weaviate: number of replicas'
        type: integer
      replication_num:
        description: 'Doris: replication_num PROPERTIES'
        type: integer
      shard_number:
        description: '--- Scalability fields ---'
        type: integer
      shards_num:
        description: 'Milvus: number of shards per collection (CreateCollection)'
        type: integer
    type: object
  github_com_jrmatherly_ai-kb_internal_types.IndexingStrategy:
    properties:
      graph_enabled:
        description: GraphEnabled enables knowledge graph entity/relation extraction
        type: boolean
      keyword_enabled:
        description: KeywordEnabled enables keyword-based (BM25) search
        type: boolean
      vector_enabled:
        description: VectorEnabled enables semantic vector embedding and search
        type: boolean
      wiki_enabled:
        description: WikiEnabled enables automatic wiki page generation from documents
        type: boolean
    type: object
  github_com_jrmatherly_ai-kb_internal_types.InviteMemberRequest:
    properties:
      representative_user_id:
        description: |-
          RepresentativeUserID is accepted for compatibility and ignored: a
          direct add attaches no user of the enrolled workspace, since the
          inviter must not choose whose details the roster shows.
        type: string
      role:
        allOf:
        - $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.OrgMemberRole'
        description: 'Role to assign: admin/editor/viewer'
      tenant_id:
        description: TenantID is the workspace to enrol as an org member. Preferred
          field.
        type: integer
      user_id:
        description: |-
          UserID is retained for backward compatibility. When set without
          TenantID, the handler resolves the user's TenantID.
        type: string
    required:
    - role
    type: object
  github_com_jrmatherly_ai-kb_internal_types.JoinByOrganizationIDRequest:
    properties:
      message:
        description: Optional message for join request
        maxLength: 500
        type: string
      organization_id:
        type: string
      role:
        allOf:
        - $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.OrgMemberRole'
        description: 'Optional: requested role (admin/editor/viewer); default viewer'
    required:
    - organization_id
    type: object
  github_com_jrmatherly_ai-kb_internal_types.JoinOrganizationRequest:
    properties:
      invite_code:
        maxLength: 32
        minLength: 8
        type: string
    required:
    - invite_code
    type: object
  github_com_jrmatherly_ai-kb_internal_types.KBCloneTaskStatus:
    enum:
    - pending
    - processing
    - completed
    - failed
    type: string
    x-enum-varnames:
    - KBCloneStatusPending
    - KBCloneStatusProcessing
    - KBCloneStatusCompleted
    - KBCloneStatusFailed
  github_com_jrmatherly_ai-kb_internal_types.KS3EngineConfig:
    properties:
      access_key:
        type: string
      bucket_name:
        type: string
      endpoint:
        type: string
      path_prefix:
        type: string
      region:
        type: string
      secret_key:
        type: string
    type: object
  github_com_jrmatherly_ai-kb_internal_types.KnowledgeBase:
    properties:
      asr_config:
        allOf:
        - $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.ASRConfig'
        description: ASR config (Automatic Speech Recognition)
      auto_tag_config:
        allOf:
        - $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.AutoTagConfig'
        description: AutoTagConfig controls asynchronous association of existing tags
          after parsing.
      chunk_count:
        description: Chunk count (not stored in database, calculated on query)
        type: integer
      chunking_config:
        allOf:
        - $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.ChunkingConfig'
        description: Chunking configuration
      created_at:
        description: Creation time of the knowledge base
        type: string
      creator_id:
        description: |-
          CreatorID records the user ID of whoever originally created the KB.
          Used by the workspace-level RBAC middleware to let Contributors edit
          their own KBs without granting them access to everyone else's.
          Nullable for backward compatibility with rows created before the
          RBAC migration backfilled the column to the workspace Owner.
        type: string
      creator_name:
        description: |-
          CreatorName is the display name (username, email and so on) of the CreatorID user.
          The handler batch-fills it for list responses only; it is not persisted. Empty means
          the creator cannot be resolved (deleted user, old rows with no CreatorID). The
          frontend uses it to split the card source badge into mine vs workspace.
        type: string
      deleted_at:
        allOf:
        - $ref: '#/definitions/gorm.DeletedAt'
        description: Deletion time of the knowledge base
      description:
        description: Description of the knowledge base
        type: string
      embedding_model_id:
        description: ID of the embedding model
        type: string
      extract_config:
        allOf:
        - $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.ExtractConfig'
        description: Extract config
      faq_config:
        allOf:
        - $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.FAQConfig'
        description: FAQConfig stores FAQ specific configuration such as indexing
          strategy
      generated_profile:
        allOf:
        - $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.KnowledgeBaseProfile'
        description: |-
          GeneratedProfile is the machine-generated description: a gist, merged
          topics, typical questions and the aggregate snapshot they came from. It
          never overwrites the user-authored Description; both are shown to agents.
      id:
        description: Unique identifier of the knowledge base
        type: string
      image_processing_config:
        allOf:
        - $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.ImageProcessingConfig'
        description: Image processing configuration
      indexing_strategy:
        allOf:
        - $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.IndexingStrategy'
        description: |-
          IndexingStrategy controls which indexing pipelines are active for this knowledge base.
          Pipelines: vector search, keyword search, wiki generation, knowledge graph extraction.
      is_pinned:
        description: |-
          IsPinned and PinnedAt are computed per-caller from user_kb_pins
          (see migration 000050). They used to be stored on the row itself,
          which made pinning a workspace-wide ordering decision gated behind
          the kb-edit RBAC guard. The columns are still present in legacy
          schemas for rollback safety but are no longer read or written by
          the application - both fields are tagged `gorm:"-"` so GORM
          ignores them on every CRUD call and the list handler stamps them
          after enriching with the caller's pin set.
        type: boolean
      is_processing:
        description: IsProcessing indicates if there is a processing import task (for
          FAQ type knowledge bases)
        type: boolean
      is_temporary:
        description: Whether this knowledge base is temporary (ephemeral) and should
          be hidden from UI
        type: boolean
      knowledge_count:
        description: Knowledge count (not stored in database, calculated on query)
        type: integer
      name:
        description: Name of the knowledge base
        type: string
      pinned_at:
        description: |-
          PinnedAt records when the current caller pinned this knowledge
          base; nil when they have not.
        type: string
      processing_count:
        description: ProcessingCount indicates the number of knowledge items being
          processed (for document type knowledge bases)
        type: integer
      profile_config:
        allOf:
        - $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.KnowledgeBaseProfileConfig'
        description: |-
          ProfileConfig controls automatic generation of the knowledge-base
          description from per-document profiles (document knowledge bases only).
      question_generation_config:
        allOf:
        - $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.QuestionGenerationConfig'
        description: QuestionGenerationConfig stores question generation configuration
          for document knowledge bases
      share_count:
        description: ShareCount indicates the number of organizations this knowledge
          base is shared with (not stored in database)
        type: integer
      storage_backend_id:
        description: |-
          StorageBackendID binds this KB to one concrete storage instance. The
          legacy provider field remains readable during migration only.
        type: string
      storage_config:
        allOf:
        - $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.StorageConfig'
        description: 'Deprecated: legacy COS config column. Kept for backward compatibility
          with old data.'
      storage_provider_config:
        allOf:
        - $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.StorageProviderConfig'
        description: 'Storage provider config (new): only stores provider selection;
          credentials from workspace StorageEngineConfig'
      summary_model_id:
        description: Summary model ID
        type: string
      tenant_id:
        description: Workspace ID
        type: integer
      type:
        description: Type of the knowledge base (document, faq, etc.)
        type: string
      updated_at:
        description: Last updated time of the knowledge base
        type: string
      vector_store_id:
        description: |-
          VectorStoreID references the VectorStore this knowledge base is bound to.
          When nil, the KB falls back to the workspace's effective engines derived from
          the RETRIEVE_DRIVER environment variable (env store flow).
          This field is set once at creation time and must not be modified afterwards;
          enforcement lives at the GORM layer (`<-:create`) plus the service-layer
          KB update path, which omits this field from its update DTO.
        type: string
      vlm_config:
        allOf:
        - $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.VLMConfig'
        description: VLM config
      wiki_config:
        allOf:
        - $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.WikiConfig'
        description: WikiConfig stores wiki-specific configuration (only for wiki
          type knowledge bases)
    type: object
  github_com_jrmatherly_ai-kb_internal_types.KnowledgeBaseConfig:
    properties:
      auto_tag_config:
        allOf:
        - $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.AutoTagConfig'
        description: AutoTagConfig controls optional automatic association of existing
          KB tags.
      chunking_config:
        allOf:
        - $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.ChunkingConfig'
        description: Chunking configuration
      faq_config:
        allOf:
        - $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.FAQConfig'
        description: FAQ configuration (only for FAQ type knowledge bases)
      image_processing_config:
        allOf:
        - $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.ImageProcessingConfig'
        description: |-
          Image processing configuration.

          nil means "no change" when updating, the same contract IndexingStrategy
          uses. A request that does not mention this field must leave the image
          settings alone: the attribute-observation switch and the attribute policy
          are things a knowledge base accumulates, and a client that predates them
          would otherwise reset the lot on any save. Sending an object - empty
          included - replaces the whole configuration.
      indexing_strategy:
        allOf:
        - $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.IndexingStrategy'
        description: |-
          IndexingStrategy controls which indexing pipelines are active.
          nil means "no change" when updating (preserves existing strategy).
      profile_config:
        allOf:
        - $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.KnowledgeBaseProfileConfig'
        description: |-
          ProfileConfig controls optional automatic knowledge-base description
          generation. nil means "no change" when updating.
      wiki_config:
        allOf:
        - $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.WikiConfig'
        description: Wiki configuration (only for wiki-enabled knowledge bases)
    type: object
  github_com_jrmatherly_ai-kb_internal_types.KnowledgeBaseProfile:
    properties:
      aggregate_hash:
        description: |-
          AggregateHash identifies the aggregate the gist was generated from. A
          mismatch with the live aggregate means the text is stale.
        type: string
      error:
        description: Error holds the last generation error when Status is failed.
        type: string
      generated_at:
        description: GeneratedAt records when the text was produced.
        type: string
      gist:
        description: Gist is a short statement of what the knowledge base covers.
        type: string
      model_id:
        description: ModelID records which chat model produced the text.
        type: string
      stats:
        allOf:
        - $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.KnowledgeBaseProfileStats'
        description: Stats is the aggregate snapshot the text was generated from.
      status:
        description: Status is one of the KnowledgeBaseProfileStatus* values.
        type: string
      topics:
        description: Topics is the merged topic list (at most KnowledgeBaseProfileMaxTopics).
        items:
          type: string
        type: array
      typical_questions:
        description: TypicalQuestions lists questions this knowledge base can answer.
        items:
          type: string
        type: array
    type: object
  github_com_jrmatherly_ai-kb_internal_types.KnowledgeBaseProfileConfig:
    properties:
      custom_instructions:
        description: |-
          CustomInstructions is appended to the stable system prompt, e.g. the
          audience the description should address or terms to keep.
        type: string
      enabled:
        type: boolean
      model_id:
        description: ModelID overrides the chat model; empty falls back to the KB
          summary model.
        type: string
    type: object
  github_com_jrmatherly_ai-kb_internal_types.KnowledgeBaseProfileStats:
    properties:
      doc_types:
        description: DocTypes counts documents per model-assigned document type.
        items:
          $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.NamedCount'
        type: array
      document_count:
        description: DocumentCount is the number of eligible documents at generation
          time.
        type: integer
      earliest_at:
        description: EarliestAt and LatestAt bound document creation times.
        type: string
      file_types:
        description: FileTypes counts documents per file extension.
        items:
          $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.NamedCount'
        type: array
      folders:
        description: Folders lists the top-level folder names present.
        items:
          type: string
        type: array
      latest_at:
        type: string
      profiled_count:
        description: ProfiledCount is how many of them carried a document profile.
        type: integer
      raw_topics:
        description: RawTopics counts documents per normalized topic keyword before
          merging.
        items:
          $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.NamedCount'
        type: array
      tags:
        description: Tags counts documents per knowledge-base tag.
        items:
          $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.NamedCount'
        type: array
    type: object
  github_com_jrmatherly_ai-kb_internal_types.KnowledgeBaseShareResponse:
    properties:
      chunk_count:
        type: integer
      created_at:
        type: string
      id:
        type: string
      knowledge_base_id:
        type: string
      knowledge_base_name:
        type: string
      knowledge_base_type:
        type: string
      knowledge_count:
        type: integer
      my_permission:
        description: Effective permission for current user = min(Permission, MyRoleInOrg)
        type: string
      my_role_in_org:
        description: Current user's role in this organization (admin/editor/viewer)
        type: string
      organization_id:
        type: string
      organization_name:
        type: string
      permission:
        description: 'Share permission (what the space was granted: viewer/editor)'
        type: string
      require_approval:
        type: boolean
      shared_by_user_id:
        type: string
      shared_by_username:
        type: string
      source_tenant_id:
        type: integer
    type: object
  github_com_jrmatherly_ai-kb_internal_types.KnowledgeMoveProgress:
    properties:
      created_at:
        description: task creation time
        type: integer
      error:
        description: error message
        type: string
      failed:
        description: failed
        type: integer
      message:
        description: status message
        type: string
      processed:
        description: processed
        type: integer
      progress:
        description: 0-100
        type: integer
      source_kb_id:
        type: string
      status:
        $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.KBCloneTaskStatus'
      target_kb_id:
        type: string
      task_id:
        type: string
      total:
        description: total knowledge items
        type: integer
      updated_at:
        description: last update time
        type: integer
    type: object
  github_com_jrmatherly_ai-kb_internal_types.KnowledgeProcessOverrides:
    properties:
      asr_config:
        $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.ASRConfig'
      chunking_config:
        $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.ChunkingConfig'
      enable_multimodel:
        type: boolean
      extract_config:
        $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.ExtractConfig'
      graph_enabled:
        type: boolean
      image_actions:
        allOf:
        - $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.ImageActionsConfig'
        description: |-
          ImageActions overrides rows of the attribute->work table for this document
          (merged per action key on top of the knowledge base's table).
          nil keeps the knowledge base's setting.
      image_attrs_enabled:
        description: |-
          ImageAttrsEnabled overrides the knowledge base's attribute-observed image
          pipeline switch for this one document. nil keeps the knowledge base's
          setting.
        type: boolean
      image_vector_enabled:
        description: |-
          ImageVectorEnabled overrides image vector indexing for this document.
          It does not change the KB-wide retrieval setting or embedding model.
        type: boolean
      parser_engine_overrides:
        additionalProperties:
          type: string
        description: |-
          ParserEngineOverrides passes key-value configuration to docreader parsers
          (e.g. pdf_force_scanned=true). Merged with workspace-level overrides in the
          parse pipeline; per-upload values take priority on conflict.
        type: object
      parser_engine_rules:
        items:
          $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.ParserEngineRule'
        type: array
      question_generation_config:
        $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.QuestionGenerationConfig'
      summary_enabled:
        description: SummaryEnabled defaults to true when omitted for backward compatibility.
        type: boolean
      vlm_config:
        $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.VLMConfig'
    type: object
  github_com_jrmatherly_ai-kb_internal_types.ListMembersResponse:
    properties:
      members:
        items:
          $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.OrganizationMemberResponse'
        type: array
      total:
        type: integer
    type: object
  github_com_jrmatherly_ai-kb_internal_types.ListOrganizationsResponse:
    properties:
      organizations:
        items:
          $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.OrganizationResponse'
        type: array
      resource_counts:
        allOf:
        - $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.ResourceCountsByOrgResponse'
        description: knowledge base and agent counts per workspace, for the list sidebar
      total:
        type: integer
    type: object
  github_com_jrmatherly_ai-kb_internal_types.ListSharesResponse:
    properties:
      shares:
        items:
          $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.KnowledgeBaseShareResponse'
        type: array
      total:
        type: integer
    type: object
  github_com_jrmatherly_ai-kb_internal_types.LocalEngineConfig:
    properties:
      path_prefix:
        type: string
    type: object
  github_com_jrmatherly_ai-kb_internal_types.LoginRequest:
    properties:
      email:
        type: string
      password:
        minLength: 6
        type: string
    required:
    - email
    - password
    type: object
  github_com_jrmatherly_ai-kb_internal_types.LoginResponse:
    properties:
      active_tenant:
        allOf:
        - $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.Tenant'
        description: |-
          ActiveTenant is the workspace whose ID is encoded in the issued JWT;
          future requests are scoped to it until the client calls /auth/switch-tenant.
          Defaults to the user's home workspace on a fresh login.
      memberships:
        description: |-
          Memberships lists every workspace the user can authenticate into,
          along with their role in each. Always populated (length 1 for users
          who only belong to their home workspace) so frontends can render a
          workspace switcher without a follow-up request. Serialised without
          omitempty so the field is always present as a JSON array (possibly
          empty) - the "always populated" contract relies on the server side
          guaranteeing a non-nil slice.
        items:
          $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.Membership'
        type: array
      message:
        type: string
      refresh_token:
        type: string
      success:
        type: boolean
      token:
        type: string
      user:
        $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.User'
    type: object
  github_com_jrmatherly_ai-kb_internal_types.MCPAdvancedConfig:
    properties:
      retry_count:
        description: 'Number of retries, default: 3'
        type: integer
      retry_delay:
        description: 'Delay between retries in seconds, default: 1'
        type: integer
      timeout:
        description: 'Timeout in seconds, default: 30'
        type: integer
    type: object
  github_com_jrmatherly_ai-kb_internal_types.MCPAuthConfig:
    properties:
      api_key:
        type: string
      api_key_header:
        description: |-
          APIKeyHeader is the header name that carries APIKey when AuthType is
          api_key. Empty defaults to "X-API-Key". This is non-secret structural
          config (the secret is APIKey), so it is not encrypted and is safe to echo
          back in responses. It lets services that expect the key in a different
          header (e.g. the raw token directly in "Authorization") work without
          resorting to plaintext custom headers.
        type: string
      auth_server_metadata_url:
        description: |-
          AuthServerMetadataURL optionally pins the OAuth authorization server
          metadata URL. When empty, the server is discovered automatically from
          the MCP URL (RFC 9728 / RFC 8414).
        type: string
      auth_type:
        allOf:
        - $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.MCPAuthType'
        description: |-
          AuthType selects the authentication strategy. Empty ("") is treated as
          none for backward compatibility with rows that pre-date this field.
      custom_headers:
        additionalProperties:
          type: string
        type: object
      scopes:
        description: Scopes are the OAuth scopes requested during authorization. Optional.
        items:
          type: string
        type: array
      token:
        type: string
    type: object
  github_com_jrmatherly_ai-kb_internal_types.MCPAuthType:
    enum:
    - ""
    - api_key
    - bearer
    - oauth
    type: string
    x-enum-varnames:
    - MCPAuthNone
    - MCPAuthAPIKey
    - MCPAuthBearer
    - MCPAuthOAuth
  github_com_jrmatherly_ai-kb_internal_types.MCPEnvVars:
    additionalProperties:
      type: string
    type: object
  github_com_jrmatherly_ai-kb_internal_types.MCPHeaders:
    additionalProperties:
      type: string
    type: object
  github_com_jrmatherly_ai-kb_internal_types.MCPService:
    properties:
      advanced_config:
        $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.MCPAdvancedConfig'
      auth_config:
        $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.MCPAuthConfig'
      created_at:
        type: string
      deleted_at:
        $ref: '#/definitions/gorm.DeletedAt'
      description:
        type: string
      enabled:
        type: boolean
      env_vars:
        allOf:
        - $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.MCPEnvVars'
        description: Environment variables for stdio
      headers:
        $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.MCPHeaders'
      id:
        type: string
      is_builtin:
        description: Whether this is a builtin MCP service (visible to all workspaces)
        type: boolean
      name:
        type: string
      stdio_config:
        allOf:
        - $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.MCPStdioConfig'
        description: Required for stdio transport
      tenant_id:
        type: integer
