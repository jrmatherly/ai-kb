      parameters:
      - description: Queue name
        in: path
        name: queue
        required: true
        type: string
      - description: Task state
        enum:
        - pending
        - active
        - scheduled
        - retry
        - archived
        - completed
        in: query
        name: state
        required: true
        type: string
      - description: Opaque continuation cursor
        in: query
        name: cursor
        type: string
      - default: 20
        description: Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.RuntimeTasksResponse'
      summary: List runtime queue tasks by state
      tags:
      - System Admin
  /system/admin/runtime/queues/{queue}/tasks/{task_id}/actions/{action}:
    post:
      parameters:
      - description: Queue name
        in: path
        name: queue
        required: true
        type: string
      - description: Task ID
        in: path
        name: task_id
        required: true
        type: string
      - description: Action
        enum:
        - cancel
        - run_now
        - delete
        in: path
        name: action
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
