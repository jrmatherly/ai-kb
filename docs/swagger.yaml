securityDefinitions:
  ApiKeyAuth:
    description: API key auth. Workspace keys reach their own workspace; platform
      keys must also send X-Tenant-ID
    in: header
    name: X-API-Key
    type: apiKey
  Bearer:
    description: 'User login authentication: enter a JWT in the form Bearer {token}'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
