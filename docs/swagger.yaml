      parameters:
      - description: Vector store ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated fields
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.UpdateStoreRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Updated vector store
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Env store or validation error
          schema:
            $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_errors.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_errors.ErrorResponse'
        "404":
          description: Vector store not found
          schema:
            $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_errors.ErrorResponse'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Update vector store
      tags:
      - VectorStore
