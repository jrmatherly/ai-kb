  /auth/switch-tenant:
    post:
      consumes:
      - application/json
      description: |-
        Reissues the access token for the current user in the target workspace; the user needs an active
        membership there (cross-tenant superusers excepted).
        A successful switch writes the target workspace to the last-active-tenant preference, so the next login
        and refresh land there (the refresh JWT carries no tenant_id).
        The preference is per account: one switch changes where the next login or refresh lands on every
        device. If writing the preference fails, the switch fails and no new token is issued.
      parameters:
      - description: Switch request
        in: body
        name: request
        required: true
        schema:
          properties:
            refresh_token:
              type: string
            tenant_id:
              type: integer
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_types.LoginResponse'
        "400":
          description: Invalid parameters
          schema:
            $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_errors.ErrorResponse'
        "403":
          description: No membership in the workspace
          schema:
            $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_errors.ErrorResponse'
        "500":
          description: Internal server error, including a failed preference write
          schema:
            $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_errors.ErrorResponse'
      security:
      - Bearer: []
      summary: Switch the active workspace
      tags:
      - Auth
