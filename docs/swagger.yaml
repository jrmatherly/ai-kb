      - application/json
      responses:
        "200":
          description: Storage backend details
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_errors.ErrorResponse'
        "404":
          description: Storage backend not found
          schema:
            $ref: '#/definitions/github_com_jrmatherly_ai-kb_internal_errors.ErrorResponse'
