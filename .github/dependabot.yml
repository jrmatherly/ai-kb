# Routine version updates: /cli (Go) and github-actions (keeps the SHA pins and
# their `# tag` comments current), monthly, grouped. Every other ecosystem is
# security-only: `open-pull-requests-limit: 0` plus a wildcard `ignore` stops
# version PRs (the limit alone has been ignored before, dependabot-core#7353),
# and CVE fixes still arrive as one grouped PR per ecosystem.
# The 7-day cooldown delays version PRs only; security updates ignore it.
# Needs "Dependabot security updates" enabled in the repository settings.
version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
    groups:
      server-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: "/cli"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      cli-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      cli-deps-major:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: gomod
