name: 🧬 CLI E2E

# Runs the cli/acceptance/e2e/ suite against a real AI KB server.
# Cost-gated so it doesn't fire on every PR:
#   - workflow_dispatch: maintainer can trigger manually
#   - pull_request labeled "acceptance-e2e": adding the label kicks a run
#
# Required repo secrets (set only on jrmatherly/ai-kb; fork PRs have no
# access and the job exits early via the secrets-present guard):
#   AIKB_E2E_HOST   - https URL of the test server
#   AIKB_E2E_TOKEN  - bearer token / API key for that host

on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]
    paths:
      - "cli/**"
      - ".github/workflows/cli-e2e.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: cli
    shell: bash

permissions:
  contents: read

jobs:
  e2e:
    name: 🧪 rag full loop
    # Skip auto-trigger on label-add unless the label is exactly "acceptance-e2e".
    # Manual workflow_dispatch always runs.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'acceptance-e2e'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🐹 Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: 🔎 Check secrets present
        id: secrets
        env:
          E2E_HOST: ${{ secrets.AIKB_E2E_HOST }}
          E2E_TOKEN: ${{ secrets.AIKB_E2E_TOKEN }}
        run: |
          if [ -z "$E2E_HOST" ] || [ -z "$E2E_TOKEN" ]; then
            echo "::warning::AIKB_E2E_HOST or AIKB_E2E_TOKEN not set; skipping e2e."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 🧪 go test -tags=acceptance_e2e
        if: steps.secrets.outputs.skip == 'false'
        env:
          AIKB_E2E_HOST: ${{ secrets.AIKB_E2E_HOST }}
          AIKB_E2E_TOKEN: ${{ secrets.AIKB_E2E_TOKEN }}
        run: go test -tags=acceptance_e2e -v -timeout=8m ./acceptance/e2e/...
