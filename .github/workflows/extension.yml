name: 🧩 Browser Extension

# Build, test, and publish the AI KB browser extension (extension/).
#
# Jobs:
#   verify          the same npm commands as `area_extension` in scripts/validate.sh, then
#                   upload the zip as an artifact; on a tag, first check that the tag names
#                   the version in extension/package.json (check-manifest.mjs, run by the
#                   build, ties manifest.json to it)
#   release         on an `extension-v*` tag only, attach the zip to the GitHub release for
#                   that tag (the docs and the web UI link to releases?q=extension-v)
#   publish-chrome  on a tag, when vars.CHROME_EXTENSION_ID is set: Chrome Web Store API v2
#                   upload, then publish
#   publish-edge    on a tag, when vars.EDGE_PRODUCT_ID is set: Edge Add-ons API v1.1 upload,
#                   then publish
#
# Permissions: contents: read for the whole workflow. Only the release job gets contents: write,
# and it runs no repository code: it downloads the verified zip and calls `gh release`.
#
# Store calls use curl against the documented APIs rather than a third-party action: the
# OIDC-federated Chrome actions are new with almost no users, and a few lines of curl are a
# smaller supply-chain bet. Each publish step writes every HTTP status and body to files under
# $RUNNER_TEMP before branching on them.
#
# A store that is still reviewing the previous version rejects the new one. Chrome is asked first:
# fetchStatus reporting submittedItemRevisionStatus.state PENDING_REVIEW skips the upload. Edge
# reports it as an operation that fails with errorCode InProgressSubmission. Both end the job
# green with a warning and a run-summary line; any other failure fails the job with the response
# body.
# Edge has no API to cancel a review. Chrome's cancelSubmission runs only from a manual dispatch
# on the tag with `cancel_pending_chrome` checked, once, before the upload; each publisher can
# cancel at most six reviews a day (https://developer.chrome.com/docs/webstore/cancel-review).
#
# Repository settings:
#   vars         CHROME_PUBLISHER_ID, CHROME_EXTENSION_ID, EDGE_PRODUCT_ID, as repository
#                variables (the job `if:` runs before an environment's variables load)
#   environment  extension-stores, with deployment tags limited to `extension-v*`, holding the
#                five secrets: CHROME_CLIENT_ID, CHROME_CLIENT_SECRET, CHROME_REFRESH_TOKEN
#                (OAuth refresh token with the chromewebstore scope), EDGE_CLIENT_ID,
#                EDGE_API_KEY (Partner Center API keys expire; renew before the date it shows)
# Secrets reach curl through files under $RUNNER_TEMP, never its argv.
# The refresh token covers the whole publisher. The preferred future credential is a Google
# service account added to the publisher (Web Store API v2 accepts one), with its token minted
# per run; swap the token exchange below when that account exists.
# Both stores need the first version and all listing metadata entered by hand.

on:
  push:
    branches: [main]
    tags:
      - "extension-v*"
    paths:
      - "extension/**"
      - ".github/workflows/extension.yml"
  pull_request:
    paths:
      - "extension/**"
      - ".github/workflows/extension.yml"
  workflow_dispatch:
    inputs:
      cancel_pending_chrome:
        description: "Cancel the Chrome Web Store review in progress before uploading (run on an extension-v tag; six cancels per publisher per day)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  ARTIFACT: ai-kb-extension-zip

jobs:
  verify:
    name: 🧪 Test, type-check, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: extension
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🟢 Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          # No dependency cache: this job builds the zip the stores publish, so a poisoned cache
          # entry would ship (zizmor cache-poisoning).
          package-manager-cache: false

      - name: ⚠️ Flag a cancel request off a tag
        if: github.event_name == 'workflow_dispatch' && inputs.cancel_pending_chrome && !startsWith(github.ref, 'refs/tags/extension-v')
        run: |
          echo "::warning::cancel_pending_chrome ignored: not an extension-v tag"

      - name: 🔎 Check the tag names the packaged version
        if: startsWith(github.ref, 'refs/tags/extension-v')
        run: |
          node -e "
            const version = require('./package.json').version;
            const expected = 'extension-v' + version;
            if (process.env.GITHUB_REF_NAME !== expected) {
              console.log('::error::tag ' + process.env.GITHUB_REF_NAME + ' does not name the packaged version ' + version + ' (expected ' + expected + '). Bump with make bump-lib LIB=extension, or retag.');
              process.exit(1);
            }
          "

      - name: 📦 Install dependencies
        run: npm ci --no-audit --no-fund

      - name: 🧪 Run tests
        run: npm test

      - name: 🔎 Type-check
        run: npm run type-check

      - name: 🏗️ Build
        run: npm run build

      - name: 🗜️ Zip
        run: npm run zip

      - name: ⬆️ Upload the zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARTIFACT }}
          path: extension/ai-kb-extension-*.zip
          if-no-files-found: error

  release:
    name: 📦 Attach the zip to the GitHub release
    needs: verify
    if: startsWith(github.ref, 'refs/tags/extension-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # gh release create and upload
    steps:
      - name: ⬇️ Download the zip
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.ARTIFACT }}

      # A re-run uploads over the existing release's asset instead of failing.
      - name: 🚀 Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "AI KB browser extension ${GITHUB_REF_NAME#extension-v}" \
            --notes "Load the zip unpacked from chrome://extensions or edge://extensions, or install from the Chrome Web Store or Edge Add-ons." \
            ai-kb-extension-*.zip ||
            gh release upload "$GITHUB_REF_NAME" --clobber ai-kb-extension-*.zip

  publish-chrome:
    name: 🏪 Publish to Chrome Web Store
    needs: verify
    if: startsWith(github.ref, 'refs/tags/extension-v') && vars.CHROME_EXTENSION_ID != ''
    runs-on: ubuntu-latest
    environment: extension-stores
    permissions: {}
    timeout-minutes: 20
    steps:
      - name: ⬇️ Download the zip
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.ARTIFACT }}

      - name: 🚀 Upload and publish
        env:
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
          CANCEL_PENDING: ${{ github.event_name == 'workflow_dispatch' && inputs.cancel_pending_chrome }}
        run: |
          set -euo pipefail
          api="https://chromewebstore.googleapis.com"
          item="publishers/${CHROME_PUBLISHER_ID}/items/${CHROME_EXTENSION_ID}"
          out="$RUNNER_TEMP/chrome"
          zip="$(ls ai-kb-extension-*.zip)"
          # call <name> <curl args>: the HTTP status goes to $out.<name>.status, the body to $out.<name>.body.
          call() { local n="$1"; shift; curl -sS -o "$out.$n.body" -w '%{http_code}' "$@" > "$out.$n.status"; }
          ok() { [[ "$(cat "$out.$1.status")" == 2?? ]]; }
          fail() { echo "::error::Chrome $1 failed with HTTP $(cat "$out.$1.status")"; cat "$out.$1.body"; echo; exit 1; }

          printf '%s' "$CHROME_CLIENT_ID" > "$out.client_id"
          printf '%s' "$CHROME_CLIENT_SECRET" > "$out.client_secret"
          printf '%s' "$CHROME_REFRESH_TOKEN" > "$out.refresh_token"
          call token -X POST https://oauth2.googleapis.com/token \
            --data-urlencode "client_id@$out.client_id" \
            --data-urlencode "client_secret@$out.client_secret" \
            --data-urlencode "refresh_token@$out.refresh_token" \
            --data-urlencode grant_type=refresh_token
          ok token || fail token
          token="$(jq -er .access_token "$out.token.body")" || fail token
          echo "::add-mask::$token"
          printf 'Authorization: Bearer %s\n' "$token" > "$out.h"

          if [ "$CANCEL_PENDING" = true ]; then
            call cancel -X POST -H @"$out.h" -H "Content-Length: 0" "$api/v2/$item:cancelSubmission"
            ok cancel || fail cancel
            echo "Chrome: cancelled the pending review before uploading $GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
          fi

          # The store may still report PENDING_REVIEW right after a cancel, so the gate is skipped then.
          if [ "$CANCEL_PENDING" != true ]; then
            call review -H @"$out.h" "$api/v2/$item:fetchStatus"
            ok review || fail review
            if [ "$(jq -r '.submittedItemRevisionStatus.state // empty' "$out.review.body")" = PENDING_REVIEW ]; then
              echo "::warning::Chrome Web Store: a review is pending; nothing published for $GITHUB_REF_NAME."
              echo "Chrome: a review is pending, nothing published for $GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi

          # The X-Goog-Upload headers are what fregante/chrome-webstore-upload sends against v2.
          call upload -X POST -H @"$out.h" -H "X-Goog-Upload-Protocol: raw" -H "X-Goog-Upload-File-Name: $zip" \
            --data-binary "@$zip" "$api/upload/v2/$item:upload"
          ok upload || fail upload
          last=upload
          state="$(jq -r .uploadState "$out.upload.body")"
          deadline=$((SECONDS + 600))
          # The v2 docs spell the async state both ways.
          while [ "$state" = IN_PROGRESS ] || [ "$state" = UPLOAD_IN_PROGRESS ]; do
            [ "$SECONDS" -lt "$deadline" ] || { echo "::error::Chrome upload still in progress after 10 minutes"; exit 1; }
            sleep 10
            call status -H @"$out.h" "$api/v2/$item:fetchStatus"
            ok status || fail status
            last=status
            state="$(jq -r .lastAsyncUploadState "$out.status.body")"
          done
          if [ "$state" != SUCCEEDED ]; then
            echo "::error::Chrome upload ended in state $state"; cat "$out.$last.body"; echo; exit 1
          fi

          call publish -X POST -H @"$out.h" -H "Content-Type: application/json" \
            -d '{"publishType":"DEFAULT_PUBLISH"}' "$api/v2/$item:publish"
          ok publish || fail publish
          echo "Chrome: submitted $GITHUB_REF_NAME for review (state $(jq -r .state "$out.publish.body"))" >> "$GITHUB_STEP_SUMMARY"

  publish-edge:
    name: 🏪 Publish to Edge Add-ons
    needs: verify
    if: startsWith(github.ref, 'refs/tags/extension-v') && vars.EDGE_PRODUCT_ID != ''
    runs-on: ubuntu-latest
    environment: extension-stores
    permissions: {}
    timeout-minutes: 30
    env:
      EDGE_PRODUCT_ID: ${{ vars.EDGE_PRODUCT_ID }}
    steps:
      - name: ⬇️ Download the zip
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.ARTIFACT }}

      - name: ⬆️ Upload the package to the draft
        id: upload
        env:
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/edge"
          printf 'Authorization: ApiKey %s\nX-ClientID: %s\n' "$EDGE_API_KEY" "$EDGE_CLIENT_ID" > "$out.h"
          zip="$(ls ai-kb-extension-*.zip)"
          curl -sS -o "$out.upload.body" -D "$out.upload.headers" -w '%{http_code}' -X POST \
            -H @"$out.h" -H "Content-Type: application/zip" \
            --data-binary "@$zip" \
            "https://api.addons.microsoftedge.microsoft.com/v1/products/$EDGE_PRODUCT_ID/submissions/draft/package" > "$out.upload.status"
          if [ "$(cat "$out.upload.status")" != 202 ]; then
            echo "::error::Edge upload failed with HTTP $(cat "$out.upload.status")"; cat "$out.upload.body"; exit 1
          fi
          location="$(tr -d '\r' < "$out.upload.headers" | awk 'tolower($1) == "location:" {print $2}')"
          [ -n "$location" ] || { echo "::error::Edge upload returned 202 without a Location header"; cat "$out.upload.headers"; exit 1; }
          echo "operation=${location##*/}" >> "$GITHUB_OUTPUT"

      - name: ⏳ Wait for the upload to finish
        id: poll
        env:
          OPERATION: ${{ steps.upload.outputs.operation }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/edge"
          printf 'Authorization: ApiKey %s\nX-ClientID: %s\n' "$EDGE_API_KEY" "$EDGE_CLIENT_ID" > "$out.h"
          deadline=$((SECONDS + 600))
          while :; do
            code="$(curl -sS -o "$out.poll.body" -w '%{http_code}' \
              -H @"$out.h" \
              "https://api.addons.microsoftedge.microsoft.com/v1/products/$EDGE_PRODUCT_ID/submissions/draft/package/operations/$OPERATION")"
            [ "$code" = 200 ] || { echo "::error::Edge upload status failed with HTTP $code"; cat "$out.poll.body"; exit 1; }
            case "$(jq -r .status "$out.poll.body")/$(jq -r '.errorCode // ""' "$out.poll.body")" in
              Succeeded/*) exit 0 ;;
              Failed/InProgressSubmission)
                echo "::warning::Edge Add-ons: a submission is in review (InProgressSubmission); nothing published for $GITHUB_REF_NAME."
                echo "Edge: a review is pending, nothing published for $GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
                echo "pending=true" >> "$GITHUB_OUTPUT"
                exit 0 ;;
              InProgress/*) ;;
              *) echo "::error::Edge upload failed"; cat "$out.poll.body"; echo; exit 1 ;;
            esac
            [ "$SECONDS" -lt "$deadline" ] || { echo "::error::Edge upload still in progress after 10 minutes"; exit 1; }
            sleep 10
          done

      - name: 🚀 Publish the draft and wait
        if: steps.poll.outputs.pending != 'true'
        env:
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/edge"
          printf 'Authorization: ApiKey %s\nX-ClientID: %s\n' "$EDGE_API_KEY" "$EDGE_CLIENT_ID" > "$out.h"
          base="https://api.addons.microsoftedge.microsoft.com/v1/products/$EDGE_PRODUCT_ID/submissions"
          code="$(curl -sS -o "$out.publish.body" -D "$out.publish.headers" -w '%{http_code}' -X POST \
            -H @"$out.h" -H "Content-Type: text/plain" \
            --data-binary "AI KB browser extension ${GITHUB_REF_NAME#extension-v}, built from $GITHUB_SHA." "$base")"
          [ "$code" = 202 ] || { echo "::error::Edge publish failed with HTTP $code"; cat "$out.publish.body"; exit 1; }
          location="$(tr -d '\r' < "$out.publish.headers" | awk 'tolower($1) == "location:" {print $2}')"
          [ -n "$location" ] || { echo "::error::Edge publish returned 202 without a Location header"; cat "$out.publish.headers"; exit 1; }
          operation="${location##*/}"
          deadline=$((SECONDS + 600))
          while :; do
            code="$(curl -sS -o "$out.poll.body" -w '%{http_code}' \
              -H @"$out.h" "$base/operations/$operation")"
            [ "$code" = 200 ] || { echo "::error::Edge publish status failed with HTTP $code"; cat "$out.poll.body"; exit 1; }
            case "$(jq -r .status "$out.poll.body")/$(jq -r '.errorCode // ""' "$out.poll.body")" in
              Succeeded/*)
                echo "Edge: submitted $GITHUB_REF_NAME for certification" >> "$GITHUB_STEP_SUMMARY"
                exit 0 ;;
              Failed/InProgressSubmission)
                echo "::warning::Edge Add-ons: a submission is in review (InProgressSubmission); nothing published for $GITHUB_REF_NAME."
                echo "Edge: a review is pending, nothing published for $GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
                exit 0 ;;
              InProgress/*) ;;
              *) echo "::error::Edge publish failed"; cat "$out.poll.body"; echo; exit 1 ;;
            esac
            [ "$SECONDS" -lt "$deadline" ] || { echo "::error::Edge publish still in progress after 10 minutes"; exit 1; }
            sleep 10
          done
