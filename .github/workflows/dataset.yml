name: 🧮 Dataset

on:
  push:
    branches: [main]
    paths:
      - "dataset/**"
      - ".github/workflows/dataset.yml"
  pull_request:
    paths:
      - "dataset/**"
      - ".github/workflows/dataset.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: 🧪 Dataset tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🐍 Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: 🧪 Run the offline dataset tests
        run: uv run --project dataset --locked python -m unittest discover -s dataset/tests
