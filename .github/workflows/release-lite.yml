name: 📦 Release Lite

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v2026.10.13)"
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "24"
  TAG: ${{ inputs.tag }}

jobs:
  build-frontend:
    name: 🏗️ Build frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The tag names files, the release and the Homebrew URLs, which all expect a leading v.
      - name: 🔎 Check the tag
        run: |
          if ! [[ "$TAG" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            echo "::error::tag '$TAG' must match ^v[0-9A-Za-z._-]+\$"
            exit 1
          fi

      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🟢 Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: 🏗️ Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: ⬆️ Upload frontend dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  build-binary:
    name: 🐹 Lite binary (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: build-frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - os: macos-14
            goos: darwin
            goarch: amd64
          - os: macos-14
            goos: darwin
            goarch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CGO_ENABLED: 1
      GOOS_TARGET: ${{ matrix.goos }}
      GOARCH_TARGET: ${{ matrix.goarch }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🐹 Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: ⬇️ Download frontend dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: web/

      - name: 🐹 Build
        run: |
          export EDITION=lite
          eval "$(./scripts/get_version.sh env)"
          LDFLAGS="-w -s $(./scripts/get_version.sh ldflags)"
          export CGO_CFLAGS="-Wno-deprecated-declarations"
          if [ "$GOOS_TARGET" = "darwin" ]; then
            export CGO_LDFLAGS="-Wl,-no_warn_duplicate_libraries"
          fi
          GOARCH="$GOARCH_TARGET" go build -tags "sqlite_fts5" -ldflags="${LDFLAGS}" \
            -o ai-kb-lite ./cmd/server

      - name: 📦 Package tarball
        run: |
          ARCHIVE="ai-kb-lite_${TAG}_${GOOS_TARGET}_${GOARCH_TARGET}"
          mkdir -p "${ARCHIVE}/web"
          cp ai-kb-lite "${ARCHIVE}/"
          bash ./scripts/copy-licenses.sh "${ARCHIVE}"
          cp -r web/* "${ARCHIVE}/web/"
          cp .env.lite.example "${ARCHIVE}/"
          cp docs/LITE.md "${ARCHIVE}/README.md"
          cp -r config "${ARCHIVE}/config"
          mkdir -p "${ARCHIVE}/migrations/sqlite"
          cp -r migrations/sqlite/* "${ARCHIVE}/migrations/sqlite/"
          cp deploy/ai-kb-lite.service "${ARCHIVE}/"
          tar czf "${ARCHIVE}.tar.gz" "${ARCHIVE}"
          shasum -a 256 "${ARCHIVE}.tar.gz" > "${ARCHIVE}.tar.gz.sha256"

      - name: ⬆️ Upload tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            ai-kb-lite_*.tar.gz
            ai-kb-lite_*.tar.gz.sha256
          retention-days: 3

  build-cli:
    name: 🐹 CLI binaries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      # Checked here too: this job does not wait for build-frontend, and a bad
      # tag must not be built and attested before the release job rejects it.
      - name: 🔎 Check the tag
        run: |
          if ! [[ "$TAG" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            echo "::error::tag '$TAG' must match ^v[0-9A-Za-z._-]+\$"
            exit 1
          fi

      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🐹 Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      # The CLI is pure Go, so one runner cross-compiles every target. The
      # checkout is shallow and untagged, so the version is passed in.
      - name: 🐹 Build and package
        run: |
          set -euo pipefail
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            binary=aikb
            [ "$goos" = windows ] && binary=aikb.exe
            stage="aikb_${TAG}_${goos}_${goarch}"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              make -C cli build VERSION="$TAG" BUILD_DIR="$PWD/$stage" BINARY="$binary"
            cp LICENSE "$stage/"
            if [ "$goos" = windows ]; then
              (cd "$stage" && zip -q -j "../$stage.zip" "$binary" LICENSE)
              sha256sum "$stage.zip" > "$stage.zip.sha256"
            else
              tar czf "$stage.tar.gz" -C "$stage" "$binary" LICENSE
              sha256sum "$stage.tar.gz" > "$stage.tar.gz.sha256"
            fi
          done
          ls -l aikb_*

      - name: 🔏 Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            aikb_*.tar.gz
            aikb_*.zip

      - name: ⬆️ Upload CLI archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-cli
          path: |
            aikb_*.tar.gz
            aikb_*.tar.gz.sha256
            aikb_*.zip
            aikb_*.zip.sha256
          retention-days: 3

  build-desktop-app:
    name: 🏗️ Desktop app (${{ matrix.arch_label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin/universal
            arch_label: macOS_universal
            artifact_name: desktop-macos-universal
          - os: macos-14
            platform: darwin/amd64
            arch_label: macOS_amd64
            artifact_name: desktop-macos-amd64
          - os: macos-14
            platform: darwin/arm64
            arch_label: macOS_arm64
            artifact_name: desktop-macos-arm64
          - os: ubuntu-latest
            platform: linux/amd64
            arch_label: linux_amd64
            artifact_name: desktop-linux-amd64
          - os: windows-latest
            platform: windows/amd64
            arch_label: windows_amd64
            artifact_name: desktop-windows-amd64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CGO_ENABLED: 1
      PLATFORM: ${{ matrix.platform }}
      ARCH_LABEL: ${{ matrix.arch_label }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🐹 Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: 🟢 Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      # The CLI must match the wails library version the module builds against.
      - name: 📦 Install Wails CLI
        shell: bash
        run: go install "github.com/wailsapp/wails/v2/cmd/wails@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"

      - name: 📦 Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      # Chocolatey doesn't put NSIS on PATH, and wails -nsis needs makensis there.
      - name: 📦 Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis -y
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files (x86)\NSIS"

      # sqlite-vec includes sqlite3.h but doesn't ship it, and MinGW has none. Use the header of
      # the SQLite that go-sqlite3 compiles in, so the declarations match the linked library.
      - name: 📦 Provide sqlite3.h (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          inc="$RUNNER_TEMP/sqlite-include"
          mkdir -p "$inc"
          go mod download github.com/mattn/go-sqlite3
          cp "$(go list -m -f '{{.Dir}}' github.com/mattn/go-sqlite3)/sqlite3-binding.h" "$inc/sqlite3.h"
          echo "C_INCLUDE_PATH=$(cygpath -w "$inc")" >> "$GITHUB_ENV"

      - name: 🐹 Pre-compile Go packages (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          export GOLANG_PROTOBUF_REGISTRATION_CONFLICT=warn
          export CGO_CFLAGS="-Wno-deprecated-declarations"
          cd cmd/desktop
          go build -p 1 -buildvcs=false -tags "desktop,sqlite_fts5,production" -o _prebuild_tmp.exe . || true
          rm -f _prebuild_tmp.exe

      - name: 🏗️ Build desktop app
        shell: bash
        run: |
          export EDITION=lite
          export GOLANG_PROTOBUF_REGISTRATION_CONFLICT=warn
          eval "$(./scripts/get_version.sh env)"
          LDFLAGS="$(./scripts/get_version.sh ldflags) -X 'google.golang.org/protobuf/reflect/protoregistry.conflictPolicy=warn'"
          export CGO_CFLAGS="-Wno-deprecated-declarations"

          BUILD_TAGS="sqlite_fts5"
          NSIS_FLAG=""

          if [ "$RUNNER_OS" = "Linux" ]; then
            BUILD_TAGS="sqlite_fts5 webkit2_41"
          fi
          if [ "$RUNNER_OS" = "macOS" ]; then
            export CGO_LDFLAGS="-Wl,-no_warn_duplicate_libraries"
          fi
          if [ "$RUNNER_OS" = "Windows" ]; then
            NSIS_FLAG="-nsis"
            # gojieba is C++: link the MinGW runtime in, so neither the bindings step nor a user's
            # machine loads whichever libstdc++-6.dll comes first on PATH.
            export CGO_LDFLAGS="-static"
          fi

          bash ./scripts/check-license-bundle.sh
          cd cmd/desktop
          # shellcheck disable=SC2086 # NSIS_FLAG is empty or one flag
          wails build -clean \
            -tags "${BUILD_TAGS}" \
            -platform "${PLATFORM}" \
            ${NSIS_FLAG} \
            -ldflags="${LDFLAGS}" \
            -o "AI KB Lite"

      - name: 📦 Package macOS app
        if: runner.os == 'macOS'
        run: |
          APP_BUNDLE="AI KB Lite.app"
          SRC="cmd/desktop/build/bin/${APP_BUNDLE}"
          RESOURCES="${SRC}/Contents/Resources"

          mkdir -p "${RESOURCES}/config"
          mkdir -p "${RESOURCES}/migrations/sqlite"
          bash ./scripts/copy-licenses.sh "${RESOURCES}"

          cp .env.lite.example "${RESOURCES}/.env"
          cp -r migrations/sqlite/* "${RESOURCES}/migrations/sqlite/"
          cp -r config/* "${RESOURCES}/config/"

          DMG_NAME="ai-kb-lite-app_${TAG}_${ARCH_LABEL}"

          DMG_SRC="dmg_staging"
          mkdir -p "${DMG_SRC}"
          cp -R "cmd/desktop/build/bin/${APP_BUNDLE}" "${DMG_SRC}/"
          ln -s /Applications "${DMG_SRC}/Applications"

          hdiutil create -volname "AI KB Lite" \
            -srcfolder "${DMG_SRC}" \
            -ov -format UDZO \
            "${DMG_NAME}.dmg"

          shasum -a 256 "${DMG_NAME}.dmg" > "${DMG_NAME}.dmg.sha256"

      - name: 📦 Package Linux app
        if: runner.os == 'Linux'
        run: |
          ARCHIVE="ai-kb-lite-app_${TAG}_${ARCH_LABEL}"
          mkdir -p "${ARCHIVE}"
          cp "cmd/desktop/build/bin/AI KB Lite" "${ARCHIVE}/"
          bash ./scripts/copy-licenses.sh "${ARCHIVE}"
          cp .env.lite.example "${ARCHIVE}/"
          cp docs/LITE.md "${ARCHIVE}/README.md"
          cp -r config "${ARCHIVE}/config"
          mkdir -p "${ARCHIVE}/migrations/sqlite"
          cp -r migrations/sqlite/* "${ARCHIVE}/migrations/sqlite/"
          tar czf "${ARCHIVE}.tar.gz" "${ARCHIVE}"
          # The upload globs ai-kb-lite-app_*, which would otherwise ship this directory too.
          rm -rf "${ARCHIVE}"
          shasum -a 256 "${ARCHIVE}.tar.gz" > "${ARCHIVE}.tar.gz.sha256"

      - name: 📦 Package Windows app
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ARCHIVE="ai-kb-lite-app_${TAG}_${ARCH_LABEL}"
          INSTALLER="cmd/desktop/build/bin/AI KB Lite-amd64-installer.exe"
          # Do not publish a bare executable if NSIS was unavailable: the
          # installer also carries the notices/source and supports auto-update.
          test -f "$INSTALLER"
          cp "$INSTALLER" "${ARCHIVE}_setup.exe"
          sha256sum "${ARCHIVE}_setup.exe" > "${ARCHIVE}_setup.exe.sha256"

      - name: ⬆️ Upload desktop app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ai-kb-lite-app_*
          retention-days: 3

  release:
    name: 🚀 GitHub release
    needs: [build-binary, build-desktop-app, build-cli]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: ⬇️ Download Lite tarballs and CLI archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true

      - name: ⬇️ Download desktop apps
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          merge-multiple: true

      - name: 📝 Generate release notes
        run: |
          cat > notes.md << 'NOTES'
          ## AI KB Lite @VERSION@

          ### Web CLI (command line / server deployment)

          A single binary with no external dependencies (no Docker, PostgreSQL or Redis).

          ```bash
          # 1. Extract
          tar xzf ai-kb-lite_@VERSION@_<os>_<arch>.tar.gz
          cd ai-kb-lite_@VERSION@_<os>_<arch>

          # 2. Configure
          cp .env.lite.example .env.lite
          # Edit .env.lite; at least confirm OLLAMA_BASE_URL is correct

          # 3. Start Ollama (if it is not running yet)
          ollama serve &
          ollama pull qwen2.5:7b
          ollama pull nomic-embed-text

          # 4. Run
          set -a && source .env.lite && set +a
          ./ai-kb-lite
          # Open http://localhost:8080
          ```

          | File | Platform |
          |------|------|
          | `ai-kb-lite_*_linux_amd64.tar.gz` | Linux x86_64 |
          | `ai-kb-lite_*_linux_arm64.tar.gz` | Linux ARM64 |
          | `ai-kb-lite_*_darwin_amd64.tar.gz` | macOS Intel |
          | `ai-kb-lite_*_darwin_arm64.tar.gz` | macOS Apple Silicon |

          ---

          ### Desktop app (ready to use, no command line)

          A native desktop application with the web service built in. Double-click to run.

          | File | Platform |
          |------|------|
          | `ai-kb-lite-app_*_macOS_universal.dmg` | macOS (Intel + Apple Silicon) |
          | `ai-kb-lite-app_*_macOS_amd64.dmg` | macOS Intel |
          | `ai-kb-lite-app_*_macOS_arm64.dmg` | macOS Apple Silicon |
          | `ai-kb-lite-app_*_linux_amd64.tar.gz` | Linux x86_64 |
          | `ai-kb-lite-app_*_windows_amd64_setup.exe` | Windows x86_64 (installer) |

          See [LITE.md](https://github.com/jrmatherly/ai-kb/blob/main/docs/LITE.md) for details.

          ---

          ### `aikb` command-line client

          `brew install jrmatherly/ai-kb/aikb`, or `scoop bucket add ai-kb https://github.com/jrmatherly/homebrew-ai-kb && scoop install aikb`, or an archive below. Each archive carries a build provenance attestation: `gh attestation verify <file> -R jrmatherly/ai-kb`.

          | File | Platform |
          |------|------|
          | `aikb_*_darwin_arm64.tar.gz` | macOS Apple Silicon |
          | `aikb_*_darwin_amd64.tar.gz` | macOS Intel |
          | `aikb_*_linux_amd64.tar.gz` | Linux x86_64 |
          | `aikb_*_linux_arm64.tar.gz` | Linux ARM64 |
          | `aikb_*_windows_amd64.zip` | Windows x86_64 |
          | `aikb_*_windows_arm64.zip` | Windows ARM64 |
          NOTES
          sed -i "s/@VERSION@/${TAG}/g" notes.md

      # A re-run uploads over the existing release's assets instead of failing.
      - name: 🚀 Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber \
              ai-kb-lite_*.tar.gz ai-kb-lite_*.tar.gz.sha256 ai-kb-lite-app_* \
              aikb_*.tar.gz aikb_*.tar.gz.sha256 aikb_*.zip aikb_*.zip.sha256
          else
            gh release create "$TAG" --latest \
              --target "$GITHUB_SHA" \
              --title "AI KB Lite $TAG" \
              --notes-file notes.md \
              ai-kb-lite_*.tar.gz ai-kb-lite_*.tar.gz.sha256 ai-kb-lite-app_* \
              aikb_*.tar.gz aikb_*.tar.gz.sha256 aikb_*.zip aikb_*.zip.sha256
          fi

  update-tap:
    name: 🍺 Update the tap
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The .sha256 files come from this run's artifacts, not from the CDN.
      - name: ⬇️ Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: assets

      - name: 🔑 Mint the tap App token
        id: tap-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.TAP_APP_CLIENT_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          owner: jrmatherly
          repositories: homebrew-ai-kb
          permission-contents: write

      - name: 📥 Checkout the tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jrmatherly/homebrew-ai-kb
          token: ${{ steps.tap-token.outputs.token }}
          path: tap
          persist-credentials: false

      - name: 🍺 Rewrite the formulas and the Scoop manifest
        run: python3 -I scripts/update_tap.py "$TAG" assets tap > changed.txt && cat changed.txt

      # The tap requires verified signatures, which a git push from the runner
      # cannot give. A contents-API commit made as the App with no custom
      # author is signed by GitHub; a file that does not exist yet is created.
      - name: 🚀 Commit through the API
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
          GH_REPO: jrmatherly/homebrew-ai-kb
        run: |
          set -euo pipefail
          if [ ! -s changed.txt ]; then
            echo "Tap already matches $TAG"
            exit 0
          fi
          while IFS= read -r file; do
            kind=formula
            case "$file" in bucket/*) kind=bucket ;; esac
            name=$(basename "$file")
            name="${name%.*}"
            args=()
            if sha=$(gh api "repos/${GH_REPO}/contents/${file}?ref=main" --jq .sha 2>/dev/null); then
              args=(-f sha="$sha")
            fi
            gh api --method PUT "repos/${GH_REPO}/contents/${file}" \
              -f message="chore(${kind}): update ${name} to ${TAG}" \
              -f branch=main \
              -f content="$(base64 -w0 "tap/${file}")" \
              "${args[@]}" \
              --jq '"\(.content.path) \(.commit.sha) verified=\(.commit.verification.verified)"' | tee -a commits.txt
          done < changed.txt
          if grep -qv "verified=true" commits.txt; then
            echo "a tap commit is not verified" >&2
            exit 1
          fi
