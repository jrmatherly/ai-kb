name: 🐍 MCP Server

# Tests the Python MCP server (mcp-server/) on pull requests and main, and
# publishes it to PyPI as ai-kb-mcp from an `mcp-server-v<version>` tag only.
# Publishing uses PyPI Trusted Publishing (OIDC), so no API token is stored.
#
# To release: bump the version in mcp-server/pyproject.toml and the synced
# strings (setup.py version, __init__.py __version__, aikb_mcp_server.py
# MCPServer version, main.py --version), merge, then push the matching tag.
# The publish job skips a version PyPI already has, so a re-run stays green.

on:
  push:
    branches: [main]
    tags:
      - "mcp-server-v*"
    paths:
      - "mcp-server/**"
      - ".github/workflows/mcp-server.yml"
  pull_request:
    paths:
      - "mcp-server/**"
      - ".github/workflows/mcp-server.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: 🧪 Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: mcp-server
    env:
      PYTHON_VERSION: ${{ matrix.python-version }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: 🐍 Set up Python ${{ matrix.python-version }}
        run: uv python install "$PYTHON_VERSION"

      - name: 📦 Install dependencies (test extras)
        run: uv sync --python "$PYTHON_VERSION" --extra test

      - name: 🧪 Run tests
        # unittest avoids pytest importing __init__.py as a broken package root.
        # Manual diagnostics live in check_imports.py (not matched by test_*.py).
        run: uv run --python "$PYTHON_VERSION" python -m unittest discover -s . -p "test_*.py" -v

  build:
    name: 🏗️ Build sdist + wheel
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'pull_request'
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: 🐍 Set up Python
        run: uv python install 3.12

      - name: 🏗️ Build package
        run: uv build

      - name: 🔎 Verify the wheel contains upload_paths.py
        run: |
          set -e
          if ! python3 -c "import glob, zipfile, sys; whl=glob.glob('dist/*.whl')[0]; z=zipfile.ZipFile(whl); sys.exit(0 if 'upload_paths.py' in z.namelist() else 1)"; then
            echo "::error::upload_paths.py is missing from the wheel. Check py-modules in pyproject.toml and setup.py"
            exit 1
          fi
          echo "upload_paths.py present in wheel"

      - name: ⬆️ Upload dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: mcp-server/dist/

  publish:
    name: 🚀 Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/mcp-server-v')
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/ai-kb-mcp/
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔎 Check the tag names the packaged version
        working-directory: mcp-server
        run: |
          set -e
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          expected="mcp-server-v${version}"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not name the packaged version $version (expected $expected)."
            exit 1
          fi

      - name: 🔎 Check if version is already published
        id: check_pypi
        working-directory: mcp-server
        # If PyPI already has this exact version, skip publishing so a re-run
        # stays green instead of failing with "File already exists".
        run: |
          set -e
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          echo "packaged version: $version"
          exists="$(python3 -c '
          import json, sys, urllib.request
          v = sys.argv[1]
          try:
              d = json.load(urllib.request.urlopen("https://pypi.org/pypi/ai-kb-mcp/json"))
              print("true" if v in d.get("releases", {}) else "false")
          except Exception:
              # If PyPI is unreachable or the project is brand-new (404), treat as unpublished.
              print("false")
          ' "$version")"
          echo "already on PyPI: $exists"
          if [ "$exists" = "true" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ai-kb-mcp $version is already on PyPI; skipping publish. Bump pyproject.toml (and the synced version strings) to release new changes."
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: ⬇️ Download dist
        if: steps.check_pypi.outputs.should_publish == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: 🚀 Publish to PyPI
        if: steps.check_pypi.outputs.should_publish == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
