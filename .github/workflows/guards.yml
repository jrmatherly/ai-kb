name: 🛡️ Guards

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependabot-alerts:
    name: 🔎 No open Dependabot alert
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A fork's token has no security-events scope; the same check runs when the PR merges.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      security-events: read
    steps:
      # The same check scripts/release-preflight.py runs before a bump, here on every push so an
      # alert is red on main and not only on the release machine. Dependabot rescans a pushed
      # manifest a minute or two after the push, so a commit that fixes an alert waits for that.
      - name: 🔎 List open alerts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for attempt in 1 2 3 4 5 6 7 8 9; do
            alerts=$(gh api 'repos/{owner}/{repo}/dependabot/alerts?state=open&per_page=100' \
              --jq '.[] | "\(.dependency.package.ecosystem) \(.dependency.package.name) in \(.dependency.manifest_path) (\(.security_advisory.severity), \(.security_advisory.ghsa_id)), fixed in \(.security_vulnerability.first_patched_version.identifier // "no fix published")"')
            [ -z "$alerts" ] && break
            echo "open alerts after check $attempt; waiting for Dependabot to rescan"
            sleep 20
          done
          if [ -n "$alerts" ]; then
            echo "$alerts" | sed 's/^/::error::open Dependabot alert: /'
            exit 1
          fi
          echo "no open Dependabot alert"

  english-only:
    name: 🔎 English only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔎 Check tracked files for CJK text
        run: scripts/check-english-only.sh

  emdash:
    name: 🔎 No em dashes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔎 Check tracked files for em dashes
        run: scripts/check-emdash.sh

  shellcheck:
    name: 🔎 Shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔎 Check shell scripts
        run: git ls-files -z '*.sh' 'scripts/git-hooks/*' | xargs -0 shellcheck -S warning

  rebrand:
    name: 🔎 Rebrand leftovers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔎 Check for upstream names
        run: scripts/rebrand/check-repo.sh

  workflows:
    name: 🔎 Workflow conventions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔎 Check pins, concurrency, and names
        run: scripts/check-workflows.sh

  version:
    name: 🔎 Version strings
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The tests clone this checkout and push tags back to it, which git refuses from a shallow clone.
          fetch-depth: 0

      - name: 🔎 Check every version string against VERSION and its library
        run: python3 scripts/version.py check

      # The tests check uv lockfiles (honoring docreader's uv pin) and sign commits with a throwaway ssh-keygen key.
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: docreader/pyproject.toml
          enable-cache: false

      # The tests run uv offline, so docreader's interpreter has to be installed first.
      - name: 🐍 Install docreader's Python
        run: uv python install "$(cat docreader/.python-version)"

      - name: 🧪 Test the version tooling
        run: python3 scripts/test_version.py

      - name: 🧪 Test the release preflight
        run: python3 scripts/test_release_preflight.py
