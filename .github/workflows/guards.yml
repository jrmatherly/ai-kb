name: 🛡️ Guards

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  english-only:
    name: 🔎 English only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔎 Check tracked files for CJK text
        run: scripts/check-english-only.sh

  emdash:
    name: 🔎 No em dashes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔎 Check tracked files for em dashes
        run: scripts/check-emdash.sh

  shellcheck:
    name: 🔎 Shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔎 Check shell scripts
        run: git ls-files -z '*.sh' 'scripts/git-hooks/*' | xargs -0 shellcheck -S warning

  rebrand:
    name: 🔎 Rebrand leftovers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔎 Check for upstream names
        run: scripts/rebrand/check-repo.sh

  workflows:
    name: 🔎 Workflow conventions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔎 Check pins, concurrency, and names
        run: scripts/check-workflows.sh

  version:
    name: 🔎 Version strings
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The tests clone this checkout and push tags back to it, which git refuses from a shallow clone.
          fetch-depth: 0

      - name: 🔎 Check every version string against VERSION and its library
        run: python3 scripts/version.py check

      # The tests check uv lockfiles (honoring docreader's uv pin) and sign commits with a throwaway ssh-keygen key.
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: docreader/pyproject.toml
          enable-cache: false

      # The tests run uv offline, so docreader's interpreter has to be installed first.
      - name: 🐍 Install docreader's Python
        run: uv python install "$(cat docreader/.python-version)"

      - name: 🧪 Test the version tooling
        run: python3 scripts/test_version.py
