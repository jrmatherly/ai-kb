name: 🧹 Go Lint

# The code inherited from upstream carries a large backlog of golangci-lint
# findings, so pull requests are only judged on the code they introduce. The
# filter needs a pull request diff, which is why this workflow has no other
# trigger; the companion go-lint-cache.yml keeps the caches this job restores
# from warm on main.
#
# The filter is golangci-lint's own `--new-from-merge-base` rather than the
# action's `only-new-issues`, because that option asks the GitHub API for the
# pull request patch and the API refuses any diff over 20000 lines
# ("code": "too_large"). On a large pull request the action silently falls back
# to linting everything, which reports the entire backlog and can never pass.
# Computing the merge base from git has no size limit, and `fetch-depth: 0`
# below is what makes the base commit available to do it.

on:
  pull_request:
    paths:
      - "**/*.go"
      - "**/go.mod"
      - "**/go.sum"
      - ".golangci.yml"
      - ".github/workflows/go-lint.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.26"
  GOLANGCI_LINT_VERSION: "v2.14.0"
  GOPROXY: https://proxy.golang.org,direct

jobs:
  # Lint only the modules the PR touches, so a root-only change does not queue
  # cli/ and client/ runners. Changing .golangci.yml or this workflow still
  # lints every module, since they share the root config.
  changes:
    name: 🧭 detect lint modules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      modules: ${{ steps.detect.outputs.modules }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 🧭 Detect changed modules
        id: detect
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          diff_range="$PR_BASE_SHA...$PR_HEAD_SHA"
          modules=()
          if git diff --name-only --diff-filter=ACMR "$diff_range" -- \
               .golangci.yml .github/workflows/go-lint.yml | grep -q .; then
            modules=("." "cli" "client")
          else
            if git diff --name-only --diff-filter=ACMR "$diff_range" -- \
                 '*.go' ':!cli/**' ':!client/**' go.mod go.sum | grep -q .; then
              modules+=(".")
            fi
            if git diff --name-only --diff-filter=ACMR "$diff_range" -- 'cli/**' | grep -q .; then
              modules+=("cli")
            fi
            if git diff --name-only --diff-filter=ACMR "$diff_range" -- 'client/**' | grep -q .; then
              modules+=("client")
            fi
          fi
          json=$(printf '%s\n' "${modules[@]}" | jq -Rnc '[inputs | select(. != "")]')
          echo "modules=${json}" >> "$GITHUB_OUTPUT"
          echo "Lint modules: ${json}"

  golangci:
    name: 🧹 golangci-lint (${{ matrix.module }})
    needs: changes
    if: needs.changes.outputs.modules != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.changes.outputs.modules) }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 🐹 Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: 🧹 golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: ${{ matrix.module }}
          # Deliberately off: see the note at the top of this file. The same
          # filtering is done below, from git.
          only-new-issues: false
          args: --new-from-merge-base=${{ github.event.pull_request.base.sha }}
