name: ⎈ Helm

on:
  push:
    branches: [main]
    paths:
      - "helm/**"
      - ".github/workflows/helm.yml"
  pull_request:
    paths:
      - "helm/**"
      - ".github/workflows/helm.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  chart:
    name: ⎈ Lint and render chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⎈ Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.0

      - name: 🧹 Lint chart
        run: helm lint ./helm

      - name: 🐍 Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: 🧪 Verify App rollout and storage examples
        run: |
          python -m pip install PyYAML
          python -m unittest discover -s helm/tests -v

      - name: 🔎 Verify application image tags
        shell: bash
        run: |
          set -euo pipefail

          render_image() {
            local template="$1"
            shift
            helm template ai-kb ./helm \
              --show-only "$template" \
              --set secrets.dbPassword=test \
              --set secrets.redisPassword=test \
              --set secrets.jwtSecret=test \
              "$@" \
              | awk '$1 == "image:" { print $2; exit }'
          }

          app_image="$(render_image templates/app.yaml)"
          frontend_image="$(render_image templates/frontend.yaml)"
          docreader_image="$(render_image templates/docreader.yaml)"
          website_image="$(render_image templates/website.yaml)"
          app_tag="${app_image##*:}"

          test "${frontend_image##*:}" = "$app_tag"
          test "${docreader_image##*:}" = "$app_tag"
          test "${website_image##*:}" = "$app_tag"

          frontend_override="$(render_image templates/frontend.yaml --set frontend.image.tag=ui-test)"
          docreader_override="$(render_image templates/docreader.yaml --set docreader.image.tag=reader-test)"

          test "$frontend_override" = "ghcr.io/jrmatherly/ai-kb-ui:ui-test"
          test "$docreader_override" = "ghcr.io/jrmatherly/ai-kb-docreader:reader-test"
          website_override="$(render_image templates/website.yaml --set website.image.tag=site-test)"
          test "$website_override" = "ghcr.io/jrmatherly/ai-kb-website:site-test"
