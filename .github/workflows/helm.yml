name: ⎈ Helm

# Lint and render the chart on every change; publish it to GHCR when a new chart version lands on main.
#
# Jobs:
#   chart    helm lint, the render tests and the image-tag checks
#   publish  on main (push or dispatch), package helm/ at the version in Chart.yaml and push it to
#            oci://ghcr.io/jrmatherly/ai-kb/charts/ai-kb unless that version is already there, so a plain
#            edit under helm/ republishes nothing and a pushed `make bump-lib LIB=helm-chart` or
#            `make bump-version` commit is a chart release (the product bump raises the chart patch
#            with the appVersion image tag). A cluster references the chart by its version (Flux
#            OCIRepository `ref.tag`).

on:
  push:
    branches: [main]
    paths:
      - "helm/**"
      - ".github/workflows/helm.yml"
  pull_request:
    paths:
      - "helm/**"
      - ".github/workflows/helm.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  chart:
    name: ⎈ Lint and render chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⎈ Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.0

      - name: 🧹 Lint chart
        run: helm lint ./helm

      - name: 🐍 Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: 🧪 Verify App rollout and storage examples
        run: |
          python -m pip install PyYAML
          python -m unittest discover -s helm/tests -v

      - name: 🔎 Verify application image tags
        shell: bash
        run: |
          set -euo pipefail

          render_image() {
            local template="$1"
            shift
            helm template ai-kb ./helm \
              --show-only "$template" \
              --set secrets.dbPassword=test \
              --set secrets.redisPassword=test \
              --set secrets.jwtSecret=test \
              "$@" \
              | awk '$1 == "image:" { print $2; exit }'
          }

          app_image="$(render_image templates/app.yaml)"
          frontend_image="$(render_image templates/frontend.yaml)"
          docreader_image="$(render_image templates/docreader.yaml)"
          website_image="$(render_image templates/website.yaml)"
          app_tag="${app_image##*:}"

          test "${frontend_image##*:}" = "$app_tag"
          test "${docreader_image##*:}" = "$app_tag"
          test "${website_image##*:}" = "$app_tag"

          frontend_override="$(render_image templates/frontend.yaml --set frontend.image.tag=ui-test)"
          docreader_override="$(render_image templates/docreader.yaml --set docreader.image.tag=reader-test)"

          test "$frontend_override" = "ghcr.io/jrmatherly/ai-kb-ui:ui-test"
          test "$docreader_override" = "ghcr.io/jrmatherly/ai-kb-docreader:reader-test"
          website_override="$(render_image templates/website.yaml --set website.image.tag=site-test)"
          test "$website_override" = "ghcr.io/jrmatherly/ai-kb-website:site-test"

  publish:
    name: ☸️ Push chart to GHCR
    needs: chart
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write # pushes oci://ghcr.io/jrmatherly/ai-kb/charts/ai-kb
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⎈ Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.0

      - name: ☸️ Package and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          version="$(awk '$1 == "version:" { print $2; exit }' helm/Chart.yaml)"
          [ -n "$version" ] || fail "no version in helm/Chart.yaml"
          registry="oci://ghcr.io/$GITHUB_REPOSITORY/charts"
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          # helm push replaces an existing tag without complaint; a cluster may already run that version.
          # Only a definite "not found" means unpublished: a registry or token error must not turn into a push.
          if helm show chart "$registry/ai-kb" --version "$version" > /dev/null 2> "$RUNNER_TEMP/show.err"; then
            echo "Chart ai-kb $version is already published; nothing pushed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          elif ! grep -qiE 'not found|MANIFEST_UNKNOWN|NAME_UNKNOWN' "$RUNNER_TEMP/show.err"; then
            cat "$RUNNER_TEMP/show.err"; fail "could not tell whether chart $version exists"
          fi
          helm package helm --version "$version" --destination "$RUNNER_TEMP"
          helm push "$RUNNER_TEMP/ai-kb-$version.tgz" "$registry"
          echo "Pushed chart ai-kb $version (appVersion $(awk '$1 == "appVersion:" { print $2; exit }' helm/Chart.yaml)) to $registry" >> "$GITHUB_STEP_SUMMARY"
