name: 🐹 App

# Anydoc (Rust archive + `anydoc` build tag) lives in anydoc.yml so a
# migrations-only or unrelated Go PR does not compile the parser engine.

on:
  push:
    branches: [main]
    paths:
      - "**/*.go"
      - "frontend/src/i18n/locales/en-US.ts" # datasource.syncError keys, checked by internal/datasource/syncreason
      - "!cli/**"
      - "!client/**"
      # Their own workflows test cli and client; a dependency change still runs the govulncheck gate here.
      - "cli/go.mod"
      - "cli/go.sum"
      - "client/go.mod"
      - "client/go.sum"
      - "!docreader/**"
      - "!third_party/anydoc-go/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "config/**"
      - "migrations/**"
      - "testdata/**"
      - "docker/Dockerfile.app"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - "licenses/**"
      - "internal/textconv/data/**"
      - "internal/models/catalog/data/**"
      - "internal/models/parity/testdata/**"
      - "internal/models/providers/assets/**"
      - "scripts/model-catalog/**"
      - "scripts/*license*.sh"
      - "scripts/git-hooks/**"
      - "scripts/test-git-hooks.sh"
      - "scripts/check-govulncheck.sh"
      - "scripts/test-check-govulncheck.sh"
      - "scripts/govulncheck-allowlist.txt"
      - "cmd/desktop/build/windows/installer/project.nsi"
      - ".github/workflows/app.yml"
  pull_request:
    paths:
      - "**/*.go"
      - "frontend/src/i18n/locales/en-US.ts" # datasource.syncError keys, checked by internal/datasource/syncreason
      - "!cli/**"
      - "!client/**"
      # Their own workflows test cli and client; a dependency change still runs the govulncheck gate here.
      - "cli/go.mod"
      - "cli/go.sum"
      - "client/go.mod"
      - "client/go.sum"
      - "!docreader/**"
      - "!third_party/anydoc-go/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "config/**"
      - "migrations/**"
      - "testdata/**"
      - "docker/Dockerfile.app"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - "licenses/**"
      - "internal/textconv/data/**"
      - "internal/models/catalog/data/**"
      - "internal/models/parity/testdata/**"
      - "internal/models/providers/assets/**"
      - "scripts/model-catalog/**"
      - "scripts/*license*.sh"
      - "scripts/git-hooks/**"
      - "scripts/test-git-hooks.sh"
      - "scripts/check-govulncheck.sh"
      - "scripts/test-check-govulncheck.sh"
      - "scripts/govulncheck-allowlist.txt"
      - "cmd/desktop/build/windows/installer/project.nsi"
      - ".github/workflows/app.yml"
  workflow_dispatch:
  schedule:
    - cron: "41 6 * * 1" # weekly: a new advisory needs no commit to be caught

concurrency:
  # The weekly scan runs in its own group so a push to main does not cancel it.
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'schedule' || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOPROXY: https://proxy.golang.org,direct
  # Keep tests independent of a developer machine's custom log template.
  LOG_FORMAT: ""

jobs:
  verify:
    name: 🧪 Format, vet, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 🐹 Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: 📦 Download modules
        run: go mod download

      - name: 🔎 Check go.mod and go.sum are tidy
        run: go mod tidy -diff

      - name: 🔎 Verify third-party notices and source bundle
        run: |
          bash ./scripts/check-license-bundle.sh
          bash ./scripts/test-license-bundle.sh

      - name: 🎨 Check formatting
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Compare base..head, not the PR merge commit, so files changed only
            # on main after the branch point are not attributed to this PR.
            diff_range="$PR_BASE_SHA...$PR_HEAD_SHA"
          else
            base="$PUSH_BEFORE"
            if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
              base=$(git rev-parse HEAD^)
            fi
            diff_range="$base..$GITHUB_SHA"
          fi
          unformatted=$(
            git diff --name-only --diff-filter=ACMR -z "$diff_range" -- '*.go' ':!cli/**' |
              xargs -0 -r gofmt -l
          )
          if [ -n "$unformatted" ]; then
            echo "The following Go files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: 🔎 Verify generated model catalog
        run: python3 scripts/model-catalog/generate.py --check

      - name: 🔎 Verify Git hook test coverage
        run: bash ./scripts/test-git-hooks.sh

      - name: 🧪 Vet and test
        shell: bash
        run: |
          mapfile -t pkgs < <(go list ./... | grep -v '/docreader/')
          go vet "${pkgs[@]}"
          go test -race "${pkgs[@]}"
          go test -tags desktop ./internal/container

      - name: 🔎 govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          bash scripts/test-check-govulncheck.sh
          scripts/check-govulncheck.sh

      - name: 🏗️ Build server
        run: go build ./cmd/server
