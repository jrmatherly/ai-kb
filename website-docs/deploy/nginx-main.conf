# Replaces the base image's /etc/nginx/nginx.conf so nginx runs as uid 101 on
# a read-only root filesystem: the pid and temp files live under /tmp (an
# emptyDir in Kubernetes). No `user` directive: it only applies when the
# master runs as root.
#
# Baked twice by the Dockerfile. /etc/nginx/nginx.conf serves the server block
# baked at build time, for platforms that replace the entrypoint and start
# plain `nginx`. /etc/nginx/nginx-runtime.conf, which docker-entrypoint.sh
# uses, includes the server block it renders under /tmp/nginx/conf.d instead.
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/conf.d/*.conf;
}
