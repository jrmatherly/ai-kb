[project]
name = "ai-kb-dataset"
version = "0.1.0"
description = "QA dataset sampling and answer generation for AI KB (dataset/qa_dataset.py)"
requires-python = ">=3.11"
dependencies = ["openai>=2", "pandas>=2.2", "pyarrow>=17"]

[tool.uv]
# >=0.12.19 is the uv Dependabot runs (dependabot-core uv/Dockerfile); a higher floor stops its security PRs
# for this project, while the image and CI install the newest uv the spec allows.
required-version = ">=0.12.19"
exclude-newer = "2 days"
